<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f97316" />
  <meta name="description" content="LKR City — Lakhisarai, Bihar local information app demo." />
  <title>LKR City — Lakhisarai, Bihar</title>

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <style>
    :root{
      --orange:#f97316;
      --orange-dark:#ea580c;
      --orange-soft:#fff1e8;
      --orange-pale:#fff7ed;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#eee7df;
      --white:#ffffff;
      --bg:#fffaf6;
      --green:#16a34a;
      --blue:#2563eb;
      --danger:#dc2626;
      --shadow:0 10px 30px rgba(76,45,20,.08);
      --shadow-sm:0 5px 18px rgba(76,45,20,.07);
      --radius:20px;
      --nav-height:76px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}

    .app-shell{
      min-height:100vh;
      padding-bottom:calc(var(--nav-height) + env(safe-area-inset-bottom) + 12px);
    }

    .page{
      width:min(1180px,100%);
      margin:0 auto;
      padding:18px 16px 28px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .brand-logo{
      width:46px;height:46px;border-radius:15px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--orange),#fb923c);
      color:#fff;font-weight:900;font-size:18px;
      box-shadow:0 8px 20px rgba(249,115,22,.24);
      flex:none;
    }
    .brand-copy{min-width:0}
    .brand-name{font-size:18px;font-weight:850;line-height:1.1}
    .brand-sub{font-size:12px;color:var(--muted);margin-top:3px}

    .icon-btn{
      width:44px;height:44px;border:1px solid var(--line);
      background:#fff;border-radius:14px;display:grid;place-items:center;
      color:var(--text);box-shadow:var(--shadow-sm);
      flex:none;
      transition:transform .18s ease,background .18s ease;
    }
    .icon-btn:active{transform:scale(.95);background:var(--orange-pale)}
    .icon-btn svg{width:21px;height:21px}

    .hero-copy{margin:8px 0 16px}
    .eyebrow{
      display:inline-flex;align-items:center;gap:7px;
      color:var(--orange-dark);font-weight:800;font-size:12px;
      background:var(--orange-soft);padding:7px 10px;border-radius:999px;
      margin-bottom:10px;
    }
    .hero-copy h1{
      margin:0;font-size:clamp(27px,7vw,44px);
      letter-spacing:-1.2px;line-height:1.05;
    }
    .hero-copy p{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.55}

    .search-wrap{
      display:flex;align-items:center;gap:10px;
      background:#fff;border:1px solid var(--line);
      border-radius:17px;padding:0 14px;
      min-height:54px;box-shadow:var(--shadow-sm);
      margin:18px 0 22px;
    }
    .search-wrap svg{width:20px;height:20px;color:#9ca3af;flex:none}
    .search-wrap input{
      width:100%;border:0;outline:0;background:transparent;
      color:var(--text);font-size:14px;
    }
    .search-wrap input::placeholder{color:#9ca3af}
    .clear-search{
      display:none;border:0;background:#f3f4f6;color:#6b7280;
      width:27px;height:27px;border-radius:50%;font-size:18px;line-height:1;
      flex:none;
    }
    .clear-search.show{display:grid;place-items:center}

    .section-head{
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;margin:25px 0 13px;
    }
    .section-head h2{margin:0;font-size:19px;letter-spacing:-.3px}
    .section-link{
      border:0;background:none;color:var(--orange-dark);
      font-size:13px;font-weight:800;padding:7px 0;
    }

    .category-grid{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:10px;
    }
    .category-card{
      border:1px solid var(--line);background:#fff;border-radius:17px;
      padding:13px 7px;min-height:104px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:8px;text-align:center;box-shadow:var(--shadow-sm);
      transition:transform .18s ease,border-color .18s ease;
    }
    .category-card:active{transform:scale(.97)}
    .category-icon{
      width:42px;height:42px;border-radius:13px;
      display:grid;place-items:center;background:var(--orange-soft);
      font-size:22px;
    }
    .category-card span:last-child{font-size:11px;font-weight:750;line-height:1.2}

    .featured{
      margin-top:24px;
      border-radius:25px;
      padding:22px;
      color:#fff;
      background:
        radial-gradient(circle at 100% 0%,rgba(255,255,255,.2),transparent 34%),
        linear-gradient(135deg,#f97316,#ea580c);
      box-shadow:0 14px 35px rgba(234,88,12,.20);
      position:relative;overflow:hidden;
    }
    .featured:after{
      content:"";
      position:absolute;width:130px;height:130px;border-radius:50%;
      right:-50px;bottom:-60px;background:rgba(255,255,255,.11);
    }
    .featured .mini{
      font-size:12px;font-weight:800;opacity:.9;
      letter-spacing:.3px;text-transform:uppercase;
    }
    .featured h2{margin:7px 0 7px;font-size:25px;letter-spacing:-.6px}
    .featured p{margin:0;max-width:580px;font-size:13px;line-height:1.55;opacity:.93}
    .featured button{
      margin-top:17px;border:0;background:#fff;color:var(--orange-dark);
      padding:11px 15px;border-radius:12px;font-size:13px;font-weight:850;
      box-shadow:0 7px 16px rgba(91,34,4,.15);
      position:relative;z-index:1;
    }

    .horizontal{
      display:flex;gap:13px;overflow-x:auto;
      padding:2px 2px 8px;
      scroll-snap-type:x proximity;
      scrollbar-width:none;
    }
    .horizontal::-webkit-scrollbar{display:none}

    .place-card{
      background:#fff;border:1px solid var(--line);border-radius:19px;
      overflow:hidden;box-shadow:var(--shadow-sm);
      flex:0 0 245px;scroll-snap-align:start;
      transition:transform .18s ease;
    }
    .place-card:active{transform:scale(.985)}
    .place-image{
      width:100%;height:150px;object-fit:cover;background:#f3f4f6;
    }
    .place-body{padding:13px}
    .place-title{
      margin:0;font-size:15px;font-weight:850;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .meta{
      display:flex;flex-wrap:wrap;gap:7px;margin:7px 0 10px;
      color:var(--muted);font-size:11px;
    }
    .meta span{display:inline-flex;align-items:center;gap:3px}
    .chip{
      display:inline-flex;align-items:center;
      background:var(--orange-soft);color:var(--orange-dark);
      border-radius:999px;padding:5px 8px;font-weight:750;
      font-size:10px;
    }
    .detail-link{
      border:0;background:none;padding:0;color:var(--orange-dark);
      font-size:12px;font-weight:850;
    }

    .service-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;
    }
    .service-card{
      border:1px solid var(--line);background:#fff;border-radius:18px;
      padding:15px;display:flex;align-items:center;gap:12px;
      box-shadow:var(--shadow-sm);text-align:left;
    }
    .service-icon{
      width:43px;height:43px;border-radius:14px;background:var(--orange-soft);
      display:grid;place-items:center;font-size:22px;flex:none;
    }
    .service-card strong{font-size:13px;display:block}
    .service-card small{font-size:11px;color:var(--muted);display:block;margin-top:3px}

    .screen-header{
      display:flex;align-items:center;gap:11px;margin:4px 0 22px;
    }
    .back-btn{
      width:42px;height:42px;border:1px solid var(--line);background:#fff;
      border-radius:14px;display:grid;place-items:center;box-shadow:var(--shadow-sm);
    }
    .back-btn svg{width:20px;height:20px}
    .screen-title h1{margin:0;font-size:23px;letter-spacing:-.5px}
    .screen-title p{margin:3px 0 0;color:var(--muted);font-size:12px}

    .explore-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;
    }
    .explore-card{
      border:1px solid var(--line);background:#fff;border-radius:21px;
      padding:17px;min-height:150px;display:flex;flex-direction:column;
      justify-content:space-between;box-shadow:var(--shadow-sm);
      text-align:left;
    }
    .explore-card .big-icon{
      width:48px;height:48px;border-radius:15px;background:var(--orange-soft);
      display:grid;place-items:center;font-size:25px;
    }
    .explore-card strong{font-size:15px;display:block;margin-top:15px}
    .explore-card small{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:4px}
    .explore-arrow{color:var(--orange-dark);font-weight:900;font-size:12px;margin-top:11px}

    .places-toolbar{
      display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
      padding-bottom:3px;margin-bottom:14px;
    }
    .places-toolbar::-webkit-scrollbar{display:none}
    .filter-btn{
      white-space:nowrap;border:1px solid var(--line);background:#fff;
      color:#4b5563;border-radius:999px;padding:9px 12px;font-size:11px;font-weight:750;
    }
    .filter-btn.active{background:var(--orange);border-color:var(--orange);color:#fff}
    .places-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;
    }
    .places-grid .place-card{flex:auto;min-width:0}
    .places-grid .place-image{height:155px}

    .empty-state{
      text-align:center;background:#fff;border:1px dashed #e3d8cd;
      border-radius:20px;padding:35px 18px;margin-top:8px;
    }
    .empty-icon{font-size:35px;margin-bottom:8px}
    .empty-state h3{margin:0;font-size:16px}
    .empty-state p{margin:6px 0 0;color:var(--muted);font-size:12px}

    .more-list{display:grid;gap:11px}
    .more-card{
      width:100%;border:1px solid var(--line);background:#fff;
      border-radius:18px;padding:15px;display:flex;align-items:center;
      gap:13px;text-align:left;box-shadow:var(--shadow-sm);
    }
    .more-icon{
      width:46px;height:46px;border-radius:14px;background:var(--orange-soft);
      display:grid;place-items:center;font-size:23px;flex:none;
    }
    .more-card strong{font-size:14px}
    .more-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
    .more-card .chev{margin-left:auto;color:#9ca3af;font-size:22px}

    .detail-wrap{padding-bottom:15px}
    .detail-hero{
      border-radius:24px;overflow:hidden;background:#eee;
      box-shadow:var(--shadow);
    }
    .detail-image{
      width:100%;height:min(58vw,430px);min-height:240px;object-fit:cover;
    }
    .detail-content{
      background:#fff;border:1px solid var(--line);border-radius:24px;
      padding:19px;margin-top:-18px;position:relative;
      box-shadow:0 10px 30px rgba(76,45,20,.07);
    }
    .detail-content h1{margin:0;font-size:27px;letter-spacing:-.7px}
    .detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 15px}
    .detail-location{color:var(--muted);font-size:13px}
    .detail-description{font-size:14px;line-height:1.7;color:#4b5563}
    .map-btn{
      width:100%;margin-top:17px;border:0;background:var(--orange);
      color:#fff;border-radius:14px;padding:13px 15px;font-weight:850;
      box-shadow:0 8px 18px rgba(249,115,22,.22);
    }
    .info-note{
      margin-top:12px;background:var(--orange-pale);border:1px solid #fed7aa;
      color:#9a3412;border-radius:14px;padding:11px 12px;font-size:11px;line-height:1.5;
    }

    .search-results{
      margin-top:-7px;margin-bottom:16px;
      display:none;
    }
    .search-results.show{display:block}
    .search-result-title{font-size:14px;font-weight:850;margin-bottom:10px}
    .search-result-list{display:grid;gap:8px}
    .search-result{
      display:flex;align-items:center;gap:10px;padding:9px;
      border:1px solid var(--line);background:#fff;border-radius:14px;
      box-shadow:var(--shadow-sm);text-align:left;width:100%;
    }
    .search-result img{width:48px;height:48px;border-radius:11px;object-fit:cover;background:#eee}
    .search-result strong{font-size:12px}
    .search-result small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
    .search-result .arrow{margin-left:auto;color:var(--orange-dark);font-weight:900}

    .notification-toast{
      position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);
      background:#1f2937;color:#fff;border-radius:13px;padding:11px 15px;
      font-size:12px;font-weight:700;z-index:1000;opacity:0;pointer-events:none;
      transition:.25s ease;box-shadow:0 12px 30px rgba(0,0,0,.18);
      max-width:calc(100vw - 32px);text-align:center;
    }
    .notification-toast.show{opacity:1;transform:translate(-50%,0)}

    .bottom-nav{
      position:fixed;z-index:900;left:50%;bottom:0;transform:translateX(-50%);
      width:min(680px,100%);
      height:calc(var(--nav-height) + env(safe-area-inset-bottom));
      padding:7px 10px calc(7px + env(safe-area-inset-bottom));
      background:rgba(255,255,255,.94);
      border:1px solid rgba(238,231,223,.95);
      border-bottom:0;border-radius:22px 22px 0 0;
      box-shadow:0 -10px 30px rgba(76,45,20,.09);
      backdrop-filter:blur(16px);
      display:grid;grid-template-columns:repeat(4,1fr);
    }
    .nav-item{
      border:0;background:transparent;color:#8a8f98;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;border-radius:15px;font-size:10px;font-weight:800;
    }
    .nav-item svg{width:21px;height:21px;stroke-width:2}
    .nav-item.active{color:var(--orange-dark);background:var(--orange-soft)}
    .nav-item:active{transform:scale(.97)}

    .modal-backdrop{
      position:fixed;inset:0;background:rgba(31,41,55,.35);z-index:950;
      display:none;align-items:flex-end;justify-content:center;
    }
    .modal-backdrop.show{display:flex}
    .modal{
      width:min(600px,100%);background:#fff;border-radius:24px 24px 0 0;
      padding:18px 17px calc(20px + env(safe-area-inset-bottom));
      box-shadow:0 -15px 40px rgba(0,0,0,.16);
    }
    .modal-head{display:flex;align-items:center;justify-content:space-between}
    .modal-head h3{margin:0;font-size:18px}
    .modal-close{border:0;background:#f3f4f6;width:35px;height:35px;border-radius:50%}
    .modal p{font-size:13px;line-height:1.65;color:var(--muted)}
    .emergency-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .emergency-item{border:1px solid var(--line);border-radius:15px;padding:13px}
    .emergency-item strong{font-size:13px}
    .emergency-item span{display:block;color:var(--orange-dark);font-size:17px;font-weight:900;margin-top:5px}

    @media (min-width:700px){
      .page{padding:28px 26px 40px}
      .topbar{margin-bottom:26px}
      .category-grid{grid-template-columns:repeat(10,minmax(0,1fr))}
      .category-card{min-height:112px}
      .service-grid{grid-template-columns:repeat(4,1fr)}
      .places-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .explore-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .place-card{flex-basis:270px}
      .bottom-nav{bottom:14px;border:1px solid var(--line);border-radius:22px;height:72px;padding:7px}
      .app-shell{padding-bottom:105px}
    }

    @media (min-width:1050px){
      .page{padding-left:32px;padding-right:32px}
      .hero-copy h1{font-size:46px}
      .places-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .explore-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .place-card{flex-basis:285px}
    }

    @media (max-width:370px){
      .page{padding-left:12px;padding-right:12px}
      .category-grid{gap:7px}
      .category-card{min-height:94px;padding:10px 4px}
      .category-icon{width:37px;height:37px;font-size:19px}
      .category-card span:last-child{font-size:10px}
      .place-card{flex-basis:225px}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>

<body>
  <div id="app" class="app-shell"></div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" data-route="home" type="button" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-route="explore" type="button" aria-label="Explore">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/><path d="M11 8v6M8 11h6"/></svg>
      <span>Explore</span>
    </button>
    <button class="nav-item" data-route="places" type="button" aria-label="Places">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span>Places</span>
    </button>
    <button class="nav-item" data-route="more" type="button" aria-label="More">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 6h14M5 12h14M5 18h14"/></svg>
      <span>More</span>
    </button>
  </nav>

  <div id="toast" class="notification-toast" role="status" aria-live="polite"></div>

  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h3 id="modalTitle">Information</h3>
        <button id="modalClose" class="modal-close" type="button" aria-label="Close">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    /* =========================================================
       LKR CITY — Single-file public information app demo
       Future Firestore mapping:
       collection: places
       fields: name, description, category, location,
               imageUrl, mapUrl, active, createdAt
       Only active === true records should be rendered.
       ========================================================= */

    const FALLBACK_IMAGE =
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
          <rect width="800" height="500" fill="#fff1e8"/>
          <circle cx="400" cy="205" r="72" fill="#fed7aa"/>
          <path d="M335 265h130l-24-65-24 28-27-40-55 77Z" fill="#f97316"/>
          <text x="400" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#9a3412">LKR City</text>
          <text x="400" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#c2410c">Image unavailable</text>
        </svg>
      `);

    const places = [
      {
        id: "ashok-dham",
        name: "Ashok Dham",
        category: "Temple",
        location: "Lakhisarai",
        description: "Ashok Dham is a well-known Shiva temple destination in the Lakhisarai area. It is visited by devotees and is an important local place of religious interest.",
        imageUrl: "https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1200&q=82",
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Ashok+Dham+Lakhisarai+Bihar",
        active: true
      },
      {
        id: "lali-pahadi",
        name: "Lali Pahadi",
        category: "Historical / Nature",
        location: "Lakhisarai",
        description: "Lali Pahadi is associated with the archaeological and historical landscape around Lakhisarai. The hill and its surroundings offer an interesting mix of heritage and nature.",
        imageUrl: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=82",
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Lali+Pahadi+Lakhisarai+Bihar",
        active: true
      },
      {
        id: "kiul-river",
        name: "Kiul River",
        category: "Nature",
        location: "Lakhisarai",
        description: "The Kiul River is an important natural feature of the region and is closely connected with the geography and everyday life of the Lakhisarai area.",
        imageUrl: "https://images.unsplash.com/photo-1437482078695-73f5ca6c96e2?auto=format&fit=crop&w=1200&q=82",
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Kiul+River+Lakhisarai+Bihar",
        active: true
      },
      {
        id: "surya-mandir",
        name: "Surya Mandir",
        category: "Temple",
        location: "Pokharama",
        description: "Surya Mandir at Pokharama is a local religious place associated with worship of the Sun. It can be included in a local temple and heritage exploration route.",
        imageUrl: "https://images.unsplash.com/photo-1604608672516-f1b9d4c2f4e0?auto=format&fit=crop&w=1200&q=82",
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Surya+Mandir+Pokharama+Bihar",
        active: true
      },
      {
        id: "kharagpur-lake",
        name: "Kharagpur Lake",
        category: "Nature",
        location: "Munger / Lakhisarai Region",
        description: "A scenic water-and-hill destination in the wider region, useful for people looking for nature and outdoor exploration near Lakhisarai.",
        imageUrl: "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=82",
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Kharagpur+Lake+Bihar",
        active: true
      },
      {
        id: "lakhisarai-station",
        name: "Lakhisarai Junction",
        category: "Travel",
        location: "Lakhisarai",
        description: "Lakhisarai Junction is a key railway point for connecting the town with nearby cities and other parts of Bihar and India.",
        imageUrl: "https://images.unsplash.com/photo-1474487548417-781cb71495f3?auto=format&fit=crop&w=1200&q=82",
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Lakhisarai+Junction+Bihar",
        active: true
      },
      {
        id: "bihar-local-market",
        name: "Lakhisarai Local Market",
        category: "Local Market",
        location: "Lakhisarai",
        description: "Local markets are useful for discovering everyday shopping, food, services and the active street life of the town.",
        imageUrl: "https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=1200&q=82",
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Lakhisarai+Market+Bihar",
        active: true
      },
      {
        id: "old-temple",
        name: "Local Temple Trail",
        category: "Temple",
        location: "Lakhisarai District",
        description: "A demo collection entry representing local temples that can later be managed from Firestore with verified descriptions, photos and map links.",
        imageUrl: "https://images.unsplash.com/photo-1533044309907-0fa3413da946?auto=format&fit=crop&w=1200&q=82",
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Temple+Lakhisarai+Bihar",
        active: true
      }
    ];

    const categories = [
      { label: "Temples", icon: "🛕", category: "Temple" },
      { label: "Historical", icon: "🏛️", category: "Historical" },
      { label: "Nature", icon: "🌳", category: "Nature" },
      { label: "Tourist Places", icon: "📸", category: "Tourist Places" },
      { label: "Travel", icon: "🚆", category: "Travel" },
      { label: "Hospitals", icon: "🏥", category: "Hospitals" },
      { label: "Education", icon: "🎓", category: "Education" },
      { label: "Government", icon: "🏢", category: "Government" },
      { label: "Emergency", icon: "🚨", category: "Emergency" },
      { label: "Local Market", icon: "🛍️", category: "Local Market" }
    ];

    const exploreItems = [
      { title: "Places to Visit", icon: "📍", desc: "Explore local places, temples, nature and heritage.", action: "places" },
      { title: "Travel & Transport", icon: "🚆", desc: "Rail, road and local travel information.", action: "travel" },
      { title: "Health & Hospitals", icon: "🏥", desc: "Find useful health and hospital information.", action: "health" },
      { title: "Education", icon: "🎓", desc: "Schools, colleges and education information.", action: "education" },
      { title: "Government", icon: "🏢", desc: "Government offices and important public services.", action: "government" },
      { title: "About Lakhisarai", icon: "📖", desc: "Know more about the city and district.", action: "about-city" }
    ];

    const activePlaces = () => places.filter(p => p.active === true);

    const icon = (name) => {
      const icons = {
        bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>',
        search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
        back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg>',
        arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
        pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>'
      };
      return icons[name] || "";
    };

    function safeImage(url){
      return url && typeof url === "string" ? url : FALLBACK_IMAGE;
    }

    function imgTag(url, alt, className=""){
      return `<img class="${className}" src="${safeImage(url)}" alt="${escapeHtml(alt)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'">`;
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function placeCard(place){
      return `
        <article class="place-card" data-place-id="${escapeHtml(place.id)}">
          ${imgTag(place.imageUrl, place.name, "place-image")}
          <div class="place-body">
            <h3 class="place-title">${escapeHtml(place.name)}</h3>
            <div class="meta">
              <span>📍 ${escapeHtml(place.location)}</span>
              <span class="chip">${escapeHtml(place.category)}</span>
            </div>
            <button class="detail-link" type="button" data-open-place="${escapeHtml(place.id)}">
              View Details →
            </button>
          </div>
        </article>
      `;
    }

    function categoryGrid(){
      return `
        <div class="category-grid">
          ${categories.map(c => `
            <button class="category-card" type="button" data-category="${escapeHtml(c.category)}" data-category-label="${escapeHtml(c.label)}">
              <span class="category-icon">${c.icon}</span>
              <span>${escapeHtml(c.label)}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function serviceGrid(){
      const items = [
        ["🏥","Hospitals","Health & medical information","health"],
        ["🚔","Police","Safety & public service information","emergency"],
        ["🎓","Education","Schools & learning information","education"],
        ["🏢","Government Offices","Public offices & services","government"]
      ];
      return `<div class="service-grid">${items.map(([i,t,s,a])=>`
        <button class="service-card" type="button" data-explore-action="${a}">
          <span class="service-icon">${i}</span>
          <span><strong>${t}</strong><small>${s}</small></span>
        </button>`).join("")}</div>`;
    }

    function renderHome(){
      const popular = activePlaces().slice(0,4);
      return `
        <main class="page">
          <div class="topbar">
            <div class="brand">
              <div class="brand-logo">LKR</div>
              <div class="brand-copy">
                <div class="brand-name">LKR City</div>
                <div class="brand-sub">Lakhisarai, Bihar</div>
              </div>
            </div>
            <button class="icon-btn" id="notificationBtn" type="button" aria-label="Notifications">
              ${icon("bell")}
            </button>
          </div>

          <section class="hero-copy">
            <div class="eyebrow">📍 Your local city guide</div>
            <h1>Explore Lakhisarai</h1>
            <p>Apne shehar ko aur kareeb se janiye.</p>
          </section>

          <div class="search-wrap">
            ${icon("search")}
            <input id="homeSearch" type="search" autocomplete="off" placeholder="Search places, services..." aria-label="Search places and services">
            <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search">×</button>
          </div>

          <div id="searchResults" class="search-results"></div>

          <section>
            <div class="section-head">
              <h2>Explore Categories</h2>
            </div>
            ${categoryGrid()}
          </section>

          <section class="featured">
            <div class="mini">Discover your city</div>
            <h2>Apna Lakhisarai ❤️</h2>
            <p>Places, history, travel aur important local information — sab ek jagah.</p>
            <button type="button" data-route-action="places">Explore Places →</button>
          </section>

          <section>
            <div class="section-head">
              <h2>Popular Places</h2>
              <button class="section-link" type="button" data-route-action="places">View All</button>
            </div>
            <div class="horizontal">${popular.map(placeCard).join("")}</div>
          </section>

          <section>
            <div class="section-head">
              <h2>Important Services</h2>
            </div>
            ${serviceGrid()}
          </section>
        </main>
      `;
    }

    function renderExplore(){
      return `
        <main class="page">
          <div class="screen-header">
            <div class="brand-logo">LKR</div>
            <div class="screen-title">
              <h1>Explore</h1>
              <p>Lakhisarai ke useful sections</p>
            </div>
          </div>

          <div class="explore-grid">
            ${exploreItems.map(item => `
              <button class="explore-card" type="button" data-explore-action="${escapeHtml(item.action)}">
                <span class="big-icon">${item.icon}</span>
                <span>
                  <strong>${escapeHtml(item.title)}</strong>
                  <small>${escapeHtml(item.desc)}</small>
                  <span class="explore-arrow">Open →</span>
                </span>
              </button>
            `).join("")}
          </div>

          <section class="featured" style="margin-top:18px">
            <div class="mini">Local information</div>
            <h2>Made for Lakhisarai</h2>
            <p>Future versions mein verified local data, images aur services Firestore se directly load kiye ja sakte hain.</p>
          </section>
        </main>
      `;
    }

    function renderPlaces(filter="All"){
      const all = activePlaces();
      const categoriesFound = ["All", ...new Set(all.map(p => p.category))];
      const shown = filter === "All" ? all : all.filter(p => p.category === filter || (filter === "Historical" && p.category.includes("Historical")));

      return `
        <main class="page">
          <div class="screen-header">
            <button class="back-btn" type="button" data-back aria-label="Back">${icon("back")}</button>
            <div class="screen-title">
              <h1>Places</h1>
              <p>${shown.length} places in demo</p>
            </div>
          </div>

          <div class="places-toolbar">
            ${categoriesFound.map(c => `
              <button class="filter-btn ${c === filter ? "active" : ""}" type="button" data-place-filter="${escapeHtml(c)}">
                ${escapeHtml(c)}
              </button>
            `).join("")}
          </div>

          ${shown.length
            ? `<div class="places-grid">${shown.map(placeCard).join("")}</div>`
            : `<div class="empty-state"><div class="empty-icon">📍</div><h3>Koi place nahi mila.</h3><p>Dusra category filter try kijiye.</p></div>`
          }
        </main>
      `;
    }

    function renderMore(){
      const items = [
        ["ℹ️","About LKR City","App aur local information ke baare mein","about"],
        ["📸","Gallery","Lakhisarai ki photos ka future section","gallery"],
        ["📢","Important Information","Useful public updates aur notices","info"],
        ["📞","Emergency Numbers","Quick emergency contact numbers","emergency-numbers"],
        ["💡","Suggest Information","Useful local information suggest karein","suggest"]
      ];
      return `
        <main class="page">
          <div class="screen-header">
            <div class="brand-logo">LKR</div>
            <div class="screen-title">
              <h1>More</h1>
              <p>More useful options</p>
            </div>
          </div>

          <div class="more-list">
            ${items.map(([i,t,s,a])=>`
              <button class="more-card" type="button" data-more-action="${a}">
                <span class="more-icon">${i}</span>
                <span><strong>${t}</strong><small>${s}</small></span>
                <span class="chev">›</span>
              </button>
            `).join("")}
          </div>

          <div class="info-note">
            LKR City ka ye version frontend demo hai. Future mein Firestore se verified places, services, gallery aur public information connect ki ja sakti hai.
          </div>
        </main>
      `;
    }

    function renderDetail(id){
      const place = activePlaces().find(p => p.id === id);
      if(!place) return renderPlaces();

      return `
        <main class="page detail-wrap">
          <div class="screen-header">
            <button class="back-btn" type="button" data-back aria-label="Back">${icon("back")}</button>
            <div class="screen-title">
              <h1>Place Details</h1>
              <p>LKR City</p>
            </div>
          </div>

          <div class="detail-hero">
            ${imgTag(place.imageUrl, place.name, "detail-image")}
          </div>

          <section class="detail-content">
            <h1>${escapeHtml(place.name)}</h1>
            <div class="detail-meta">
              <span class="chip">${escapeHtml(place.category)}</span>
              <span class="detail-location">📍 ${escapeHtml(place.location)}</span>
            </div>
            <div class="detail-description">${escapeHtml(place.description)}</div>

            <button class="map-btn" type="button" data-map-url="${escapeHtml(place.mapUrl)}">
              📍 Open in Maps
            </button>

            <div class="info-note">
              Map button Google Maps ko new tab mein open karega. Demo mein map links public search URLs hain; future Firestore records mein exact <b>mapUrl</b> save kiya ja sakta hai.
            </div>
          </section>
        </main>
      `;
    }

    function render(){
      const app = document.getElementById("app");
      const route = state.route;

      if(route === "detail"){
        app.innerHTML = renderDetail(state.id);
      } else if(route === "explore"){
        app.innerHTML = renderExplore();
      } else if(route === "places"){
        app.innerHTML = renderPlaces(state.filter || "All");
      } else if(route === "more"){
        app.innerHTML = renderMore();
      } else {
        app.innerHTML = renderHome();
      }

      updateNav(route);
      bindPageEvents();
      window.scrollTo({top:0,behavior:"auto"});
    }

    const state = {
      route: "home",
      id: null,
      filter: "All"
    };

    function currentUrl(){
      if(state.route === "home") return "#home";
      if(state.route === "detail") return "#place/" + encodeURIComponent(state.id);
      if(state.route === "places") return "#places" + (state.filter && state.filter !== "All" ? "/" + encodeURIComponent(state.filter) : "");
      return "#" + state.route;
    }

    function parseHash(){
      const hash = location.hash.replace(/^#/,"") || "home";
      if(hash.startsWith("place/")){
        state.route = "detail";
        state.id = decodeURIComponent(hash.slice(6));
        return;
      }
      if(hash.startsWith("places/")){
        state.route = "places";
        state.filter = decodeURIComponent(hash.slice(7)) || "All";
        return;
      }
      state.route = ["home","explore","places","more"].includes(hash) ? hash : "home";
      state.id = null;
      if(state.route !== "places") state.filter = "All";
    }

    function go(route, options={}){
      state.route = route;
      state.id = options.id || null;
      state.filter = options.filter || "All";
      const hash = currentUrl();

      if(options.replace){
        history.replaceState({route,state}, "", hash);
      }else{
        history.pushState({route,state}, "", hash);
      }
      render();
    }

    function updateNav(route){
      document.querySelectorAll(".nav-item").forEach(btn=>{
        btn.classList.toggle("active", btn.dataset.route === (route === "detail" ? "places" : route));
      });
    }

    function openPlace(id){
      if(activePlaces().some(p=>p.id === id)) go("detail",{id});
    }

    function back(){
      if(history.length > 1){
        history.back();
      }else{
        go("home");
      }
    }

    function showToast(message){
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(()=>el.classList.remove("show"),2200);
    }

    function openModal(title, body){
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = body;
      document.getElementById("modalBackdrop").classList.add("show");
    }

    function closeModal(){
      document.getElementById("modalBackdrop").classList.remove("show");
    }

    function runSearch(query){
      const box = document.getElementById("searchResults");
      if(!box) return;

      const q = query.trim().toLowerCase();
      const clear = document.getElementById("clearSearch");
      if(clear) clear.classList.toggle("show", !!q);

      if(!q){
        box.classList.remove("show");
        box.innerHTML = "";
        return;
      }

      const results = activePlaces().filter(p =>
        [p.name,p.category,p.location,p.description].some(v => String(v).toLowerCase().includes(q))
      );

      box.classList.add("show");
      box.innerHTML = results.length
        ? `<div class="search-result-title">${results.length} result${results.length > 1 ? "s" : ""} found</div>
           <div class="search-result-list">
             ${results.slice(0,7).map(p=>`
               <button class="search-result" type="button" data-open-place="${escapeHtml(p.id)}">
                 ${imgTag(p.imageUrl,p.name)}
                 <span><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.location)} · ${escapeHtml(p.category)}</small></span>
                 <span class="arrow">›</span>
               </button>
             `).join("")}
           </div>`
        : `<div class="empty-state"><div class="empty-icon">🔎</div><h3>Koi place nahi mila.</h3><p>Place name, category ya location se search karein.</p></div>`;
    }

    function bindPageEvents(){
      document.querySelectorAll("[data-route-action]").forEach(btn=>{
        btn.addEventListener("click",()=>go(btn.dataset.routeAction));
      });

      document.querySelectorAll("[data-open-place]").forEach(btn=>{
        btn.addEventListener("click",()=>openPlace(btn.dataset.openPlace));
      });

      document.querySelectorAll("[data-back]").forEach(btn=>{
        btn.addEventListener("click",back);
      });

      document.querySelectorAll("[data-category]").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const category = btn.dataset.category;
          const label = btn.dataset.categoryLabel;
          const exact = activePlaces().some(p=>p.category === category);
          if(exact || category === "Historical"){
            go("places",{filter:category});
          }else{
            showToast(`${label} section future data ke liye ready hai.`);
          }
        });
      });

      document.querySelectorAll("[data-place-filter]").forEach(btn=>{
        btn.addEventListener("click",()=>go("places",{filter:btn.dataset.placeFilter}));
      });

      document.querySelectorAll("[data-map-url]").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const url = btn.dataset.mapUrl;
          if(url) window.open(url,"_blank","noopener,noreferrer");
        });
      });

      const search = document.getElementById("homeSearch");
      if(search){
        search.addEventListener("input",e=>runSearch(e.target.value));
      }

      const clear = document.getElementById("clearSearch");
      if(clear){
        clear.addEventListener("click",()=>{
          const search = document.getElementById("homeSearch");
          if(search){search.value="";search.focus();}
          runSearch("");
        });
      }

      const notificationBtn = document.getElementById("notificationBtn");
      if(notificationBtn){
        notificationBtn.addEventListener("click",()=>{
          showToast("Abhi koi new notification nahi hai.");
        });
      }

      document.querySelectorAll("[data-explore-action]").forEach(btn=>{
        btn.addEventListener("click",()=>handleExploreAction(btn.dataset.exploreAction));
      });

      document.querySelectorAll("[data-more-action]").forEach(btn=>{
        btn.addEventListener("click",()=>handleMoreAction(btn.dataset.moreAction));
      });
    }

    function handleExploreAction(action){
      if(action === "places"){
        go("places");
        return;
      }
      if(action === "travel"){
        const travel = activePlaces().filter(p=>p.category==="Travel");
        if(travel.length){
          go("places",{filter:"Travel"});
        }else{
          showToast("Travel information demo mein add ki ja sakti hai.");
        }
        return;
      }
      if(action === "health"){
        openModal("Health & Hospitals", `
          <p>Future version mein verified hospitals, address, phone number, emergency information aur map links Firestore se load kiye ja sakte hain.</p>
          <div class="emergency-grid">
            <div class="emergency-item"><strong>Ambulance</strong><span>108</span></div>
            <div class="emergency-item"><strong>Emergency</strong><span>112</span></div>
          </div>
        `);
        return;
      }
      if(action === "education"){
        openModal("Education", `<p>Lakhisarai ke schools, colleges, coaching institutes aur education services ke verified records future Firestore collection se yahan show kiye ja sakte hain.</p>`);
        return;
      }
      if(action === "government"){
        openModal("Government", `<p>Government offices ke verified name, address, phone, working hours aur mapUrl future mein Firestore se load kiye ja sakte hain.</p>`);
        return;
      }
      if(action === "about-city"){
        openModal("About Lakhisarai", `<p>Lakhisarai Bihar ka ek district aur town hai. LKR City ka goal local places, travel, public services, education, health aur important information ko ek simple mobile-friendly interface mein lana hai.</p>`);
        return;
      }
      if(action === "emergency"){
        openModal("Emergency Services", `
          <p>Common India emergency numbers:</p>
          <div class="emergency-grid">
            <div class="emergency-item"><strong>Emergency</strong><span>112</span></div>
            <div class="emergency-item"><strong>Police</strong><span>100</span></div>
            <div class="emergency-item"><strong>Fire</strong><span>101</span></div>
            <div class="emergency-item"><strong>Ambulance</strong><span>108</span></div>
          </div>
        `);
      }
    }

    function handleMoreAction(action){
      const data = {
        about: ["About LKR City", `<p><b>LKR City</b> — Lakhisarai, Bihar ke liye ek public information app demo.</p><p>Is version mein login, admin panel aur Firebase connection intentionally nahi hai. Frontend demo data JavaScript array se load hota hai.</p>`],
        gallery: ["Gallery", `<p>Gallery section future mein Firestore ke imageUrl records se banaya ja sakta hai. Firebase Storage ki zarurat nahi hogi; sirf public image URLs save kiye ja sakte hain.</p>`],
        info: ["Important Information", `<p>Future mein verified local notices, public updates aur important announcements yahan show kiye ja sakte hain.</p>`],
        suggest: ["Suggest Information", `<p>Future version mein suggestion form add karke useful local information collect ki ja sakti hai. Demo mein backend submission intentionally nahi hai.</p>`]
      };

      if(action === "emergency-numbers"){
        handleExploreAction("emergency");
        return;
      }
      if(data[action]){
        openModal(data[action][0],data[action][1]);
      }
    }

    document.querySelectorAll(".nav-item").forEach(btn=>{
      btn.addEventListener("click",()=>go(btn.dataset.route));
    });

    document.getElementById("modalClose").addEventListener("click",closeModal);
    document.getElementById("modalBackdrop").addEventListener("click",e=>{
      if(e.target.id === "modalBackdrop") closeModal();
    });

    window.addEventListener("popstate",()=>{
      parseHash();
      render();
    });

    window.addEventListener("hashchange",()=>{
      parseHash();
      render();
    });

    parseHash();
    if(!location.hash){
      history.replaceState({route:"home"},"","#home");
    }
    render();
  </script>
</body>
</html>
