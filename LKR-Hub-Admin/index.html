<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LKR Hub Admin</title>
  <link rel="icon" type="image/jpeg" href="https://cdn-icons-png.flaticon.com/512/6176/6176506.png">

  <style>
    :root{
      --orange:#f97316;
      --orange-dark:#ea580c;
      --orange-soft:#fff7ed;
      --bg:#f8fafc;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --danger:#dc2626;
      --success:#16a34a;
      --shadow:0 10px 30px rgba(15,23,42,.08);
      --radius:20px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}

    .auth-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:
        radial-gradient(circle at top right, rgba(249,115,22,.15), transparent 35%),
        var(--bg);
    }

    .auth-card{
      width:min(100%,420px);
      background:#fff;
      border:1px solid var(--border);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:28px 22px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:24px;
    }
    .brand-icon{
      width:52px;height:52px;
      border-radius:16px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--orange),#fb923c);
      color:#fff;
      font-size:25px;
      box-shadow:0 8px 20px rgba(249,115,22,.25);
    }
    .brand h1{font-size:23px;margin:0}
    .brand p{margin:3px 0 0;color:var(--muted);font-size:13px}

    .field{margin-bottom:16px}
    label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:700;
    }
    input[type="text"],
    input[type="url"],
    input[type="email"],
    input[type="password"]{
      width:100%;
      height:50px;
      border:1px solid #d1d5db;
      border-radius:13px;
      padding:0 14px;
      outline:none;
      background:#fff;
      color:var(--text);
      transition:.2s;
    }
    input:focus{
      border-color:var(--orange);
      box-shadow:0 0 0 4px rgba(249,115,22,.12);
    }

    .password-box{position:relative}
    .password-box input{padding-right:52px}
    .eye-btn{
      position:absolute;
      right:7px;top:7px;
      width:36px;height:36px;
      border:0;background:transparent;
      border-radius:10px;
      color:#6b7280;
      display:grid;
      place-items:center;
      font-size:19px;
    }
    .eye-btn:hover{background:#f3f4f6}

    .btn{
      min-height:48px;
      border:0;
      border-radius:13px;
      padding:0 17px;
      font-weight:800;
      transition:transform .15s,box-shadow .15s,background .15s;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .btn:active{transform:scale(.98)}
    .btn-primary{
      color:#fff;
      background:linear-gradient(135deg,var(--orange),var(--orange-dark));
      box-shadow:0 8px 18px rgba(249,115,22,.22);
    }
    .btn-primary:hover{box-shadow:0 10px 24px rgba(249,115,22,.3)}
    .btn-light{background:#f3f4f6;color:#374151}
    .btn-danger{background:#fee2e2;color:#b91c1c}
    .btn-success{background:#dcfce7;color:#166534}
    .btn-wide{width:100%}

    .message{
      margin:0 0 16px;
      padding:11px 13px;
      border-radius:12px;
      font-size:14px;
      font-weight:700;
    }
    .message.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
    .message.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}

    .app-shell{min-height:100vh}
    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
    }
    .topbar-inner{
      max-width:1100px;
      margin:auto;
      min-height:70px;
      padding:10px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .topbar-title{
      display:flex;align-items:center;gap:10px;
      min-width:0;
    }
    .mini-icon{
      width:42px;height:42px;border-radius:13px;
      display:grid;place-items:center;
      background:var(--orange-soft);
      color:var(--orange-dark);
      font-size:21px;
      flex:none;
    }
    .topbar-title h1{font-size:18px;margin:0}
    .topbar-title p{font-size:11px;color:var(--muted);margin:2px 0 0}

    main{
      width:min(100%,1100px);
      margin:auto;
      padding:20px 16px 42px;
    }

    .hero{
      background:linear-gradient(135deg,#fff7ed,#fff);
      border:1px solid #fed7aa;
      border-radius:22px;
      padding:20px;
      margin-bottom:18px;
    }
    .hero h2{margin:0 0 5px;font-size:24px}
    .hero p{margin:0;color:var(--muted);font-size:14px}

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .projects-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }

    .project-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:16px;
      box-shadow:0 5px 18px rgba(15,23,42,.05);
    }
    .project-head{
      display:flex;
      align-items:center;
      gap:13px;
      margin-bottom:15px;
    }
    .project-icon{
      width:58px;height:58px;
      border-radius:16px;
      object-fit:cover;
      background:var(--orange-soft);
      border:1px solid #fed7aa;
      flex:none;
    }
    .project-name{
      font-size:17px;
      font-weight:800;
      margin:0 0 5px;
      word-break:break-word;
    }
    .status{
      display:inline-flex;
      align-items:center;
      gap:5px;
      border-radius:999px;
      padding:4px 9px;
      font-size:11px;
      font-weight:800;
    }
    .status.active{background:#dcfce7;color:#166534}
    .status.inactive{background:#f3f4f6;color:#6b7280}
    .card-actions{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
    }
    .card-actions .btn{min-height:44px;padding:0 8px;font-size:13px}

    .empty{
      text-align:center;
      padding:50px 20px;
      background:#fff;
      border:1px dashed #d1d5db;
      border-radius:20px;
      color:var(--muted);
    }
    .empty-icon{font-size:40px;margin-bottom:8px}
    .loading{
      text-align:center;
      padding:35px;
      color:var(--muted);
    }

    .modal{
      position:fixed;
      inset:0;
      z-index:50;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      background:rgba(15,23,42,.55);
      padding:0;
    }
    .modal-card{
      width:min(100%,620px);
      max-height:92vh;
      overflow:auto;
      background:#fff;
      border-radius:24px 24px 0 0;
      padding:22px;
    }
    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }
    .modal-head h3{margin:0;font-size:20px}
    .close-btn{
      width:40px;height:40px;border:0;border-radius:12px;
      background:#f3f4f6;color:#374151;font-size:22px;
    }
    .form-actions{
      display:flex;
      gap:10px;
      margin-top:20px;
    }
    .form-actions .btn{flex:1}

    .switch-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:13px 14px;
      border:1px solid var(--border);
      border-radius:14px;
      margin-top:4px;
    }
    .switch-label strong{display:block;font-size:14px}
    .switch-label span{font-size:12px;color:var(--muted)}
    .switch{
      position:relative;width:52px;height:30px;flex:none;
    }
    .switch input{opacity:0;width:0;height:0}
    .slider{
      position:absolute;inset:0;
      background:#d1d5db;border-radius:999px;
      transition:.2s;
    }
    .slider:before{
      content:"";
      position:absolute;
      width:22px;height:22px;
      left:4px;top:4px;
      background:#fff;border-radius:50%;
      transition:.2s;
      box-shadow:0 2px 5px rgba(0,0,0,.2);
    }
    .switch input:checked + .slider{background:var(--orange)}
    .switch input:checked + .slider:before{transform:translateX(22px)}

    .toast{
      position:fixed;
      left:50%;
      bottom:20px;
      z-index:100;
      transform:translate(-50%,120px);
      opacity:0;
      transition:.25s;
      max-width:calc(100% - 30px);
      background:#111827;
      color:#fff;
      padding:12px 16px;
      border-radius:13px;
      font-size:14px;
      font-weight:700;
      box-shadow:var(--shadow);
      text-align:center;
    }
    .toast.show{transform:translate(-50%,0);opacity:1}

    @media(min-width:700px){
      .auth-card{padding:34px}
      .projects-grid{grid-template-columns:repeat(2,1fr)}
      .modal{align-items:center;padding:20px}
      .modal-card{border-radius:24px}
      main{padding-top:28px}
    }

    @media(min-width:980px){
      .projects-grid{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen" class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-icon">L</div>
        <div>
          <h1>LKR Hub Admin</h1>
          <p>Project Management Panel</p>
        </div>
      </div>

      <div id="loginMessage" class="message error hidden"></div>

      <form id="loginForm">
        <div class="field">
          <label for="adminPassword">Admin Password</label>
          <div class="password-box">
            <input id="adminPassword" type="password" autocomplete="current-password"
                   placeholder="Password डालें" required>
            <button class="eye-btn" type="button" id="togglePassword"
                    aria-label="Password दिखाएँ/छिपाएँ">👁️</button>
          </div>
        </div>
        <button class="btn btn-primary btn-wide" type="submit" id="loginBtn">
          Login
        </button>
      </form>
    </div>
  </section>

  <!-- ADMIN APP -->
  <section id="adminApp" class="app-shell hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-title">
          <div class="mini-icon">L</div>
          <div>
            <h1>LKR Hub Admin</h1>
            <p>Projects Management</p>
          </div>
        </div>
        <button class="btn btn-light" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <h2>Projects</h2>
        <p>Firestore में LKR Hub के सभी projects को manage करें।</p>
      </section>

      <div class="toolbar">
        <button class="btn btn-primary" id="newProjectBtn">＋ New Project</button>
        <button class="btn btn-light" id="refreshBtn">↻ Refresh</button>
      </div>

      <div id="listMessage" class="message hidden"></div>
      <div id="projectsContainer"></div>
    </main>
  </section>

  <!-- ADD / EDIT MODAL -->
  <div id="projectModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle">New Project</h3>
        <button class="close-btn" id="closeModalBtn" type="button">×</button>
      </div>

      <form id="projectForm">
        <input id="editProjectId" type="hidden">

        <div class="field">
          <label for="projectName">Project Name</label>
          <input id="projectName" type="text" placeholder="जैसे LKR Hisab" required>
        </div>

        <div class="field">
          <label for="projectUrl">Project URL</label>
          <input id="projectUrl" type="url" placeholder="https://example.com/" required>
        </div>

        <div class="field">
          <label for="iconUrl">Icon URL</label>
          <input id="iconUrl" type="url" placeholder="https://example.com/icon.png">
        </div>

        <div class="switch-row">
          <div class="switch-label">
            <strong>Project Status</strong>
            <span id="activeText">Active — User App में दिखाई देगा</span>
          </div>
          <label class="switch">
            <input id="projectActive" type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="form-actions">
          <button class="btn btn-light" type="button" id="cancelModalBtn">Cancel</button>
          <button class="btn btn-primary" type="submit" id="saveProjectBtn">Add Project</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DELETE MODAL -->
  <div id="deleteModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Delete Project</h3>
        <button class="close-btn" id="closeDeleteBtn" type="button">×</button>
      </div>

      <p style="margin:0 0 22px;color:#4b5563;line-height:1.6">
        क्या आप इस Project को Delete करना चाहते हैं?
      </p>

      <div class="form-actions">
        <button class="btn btn-light" type="button" id="cancelDeleteBtn">Cancel</button>
        <button class="btn btn-danger" type="button" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
     import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      doc,
      updateDoc,
      deleteDoc,
      serverTimestamp,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBlyhlVW2ETT36wfSeTRMKkWz1oLvTFvgo",
      authDomain: "lkr-link.firebaseapp.com",
      projectId: "lkr-link",
      storageBucket: "lkr-link.firebasestorage.app",
      messagingSenderId: "1041567842519",
      appId: "1:1041567842519:web:84dcee0602f9831d0bb092"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASSWORD = "298609";
    const ADMIN_SESSION_KEY = "lkr_hub_admin_logged_in";

    const loginScreen = document.getElementById("loginScreen");
    const adminApp = document.getElementById("adminApp");
    const loginForm = document.getElementById("loginForm");
    const adminPassword = document.getElementById("adminPassword");
    const togglePassword = document.getElementById("togglePassword");
    const loginBtn = document.getElementById("loginBtn");
    const loginMessage = document.getElementById("loginMessage");
    const logoutBtn = document.getElementById("logoutBtn");

    const projectsContainer = document.getElementById("projectsContainer");
    const listMessage = document.getElementById("listMessage");

    const projectModal = document.getElementById("projectModal");
    const deleteModal = document.getElementById("deleteModal");
    const projectForm = document.getElementById("projectForm");
    const modalTitle = document.getElementById("modalTitle");
    const editProjectId = document.getElementById("editProjectId");
    const projectName = document.getElementById("projectName");
    const projectUrl = document.getElementById("projectUrl");
    const iconUrl = document.getElementById("iconUrl");
    const projectActive = document.getElementById("projectActive");
    const activeText = document.getElementById("activeText");
    const saveProjectBtn = document.getElementById("saveProjectBtn");

    const toast = document.getElementById("toast");

    let projects = [];
    let deleteTargetId = null;
    let toastTimer = null;

    togglePassword.addEventListener("click", () => {
      const isPassword = adminPassword.type === "password";
      adminPassword.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "🙈" : "👁️";
    });

    projectActive.addEventListener("change", updateActiveText);

    function updateActiveText(){
      activeText.textContent = projectActive.checked
        ? "Active — User App में दिखाई देगा"
        : "Inactive — User App में नहीं दिखाई देगा";
    }

    function showLoginMessage(message){
      loginMessage.textContent = message;
      loginMessage.classList.remove("hidden");
    }

    function hideLoginMessage(){
      loginMessage.classList.add("hidden");
    }

    function setLoading(button, loading, loadingText){
      if(loading){
        button.dataset.originalText = button.textContent;
        button.disabled = true;
        button.textContent = loadingText;
      }else{
        button.disabled = false;
        button.textContent = button.dataset.originalText || button.textContent;
      }
    }

    function showToast(message){
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function showListError(message){
      listMessage.textContent = message;
      listMessage.className = "message error";
    }

    function clearListMessage(){
      listMessage.className = "message hidden";
      listMessage.textContent = "";
    }

    function validHttpUrl(value){
      try{
        const u = new URL(value);
        return u.protocol === "http:" || u.protocol === "https:";
      }catch{
        return false;
      }
    }

    function defaultIconData(){
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#f97316"/>
              <stop offset="1" stop-color="#ea580c"/>
            </linearGradient>
          </defs>
          <rect width="120" height="120" rx="28" fill="url(#g)"/>
          <text x="60" y="78" text-anchor="middle"
                font-family="Arial,sans-serif" font-size="58"
                font-weight="800" fill="white">L</text>
        </svg>
      `);
    }

    function safeText(value){
      return String(value ?? "");
    }

    function formatDate(timestamp){
      if(!timestamp || typeof timestamp.toDate !== "function") return "";
      try{
        return timestamp.toDate().toLocaleString("en-IN", {
          day:"2-digit", month:"short", year:"numeric"
        });
      }catch{
        return "";
      }
    }

    function renderProjects(){
      if(!projects.length){
        projectsContainer.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📁</div>
            <strong>अभी कोई Project नहीं है</strong>
            <p>New Project दबाकर पहला project add करें।</p>
          </div>
        `;
        return;
      }

      projectsContainer.innerHTML = `
        <div class="projects-grid">
          ${projects.map(project => `
            <article class="project-card">
              <div class="project-head">
                <img
                  class="project-icon"
                  src="${safeText(project.iconUrl || defaultIconData())}"
                  alt=""
                  onerror="this.onerror=null;this.src='${defaultIconData()}'"
                >
                <div style="min-width:0">
                  <h3 class="project-name">${safeText(project.name)}</h3>
                  <span class="status ${project.active ? "active" : "inactive"}">
                    ${project.active ? "● Active" : "● Inactive"}
                  </span>
                </div>
              </div>

              <div class="card-actions">
                <button class="btn btn-light" data-action="open" data-id="${project.id}">
                  Open
                </button>
                <button class="btn btn-primary" data-action="edit" data-id="${project.id}">
                  Edit
                </button>
                <button class="btn btn-danger" data-action="delete" data-id="${project.id}">
                  Delete
                </button>
              </div>

              ${project.createdAt ? `
                <div style="margin-top:12px;color:#9ca3af;font-size:11px">
                  Added: ${formatDate(project.createdAt)}
                </div>
              ` : ""}
            </article>
          `).join("")}
        </div>
      `;

      projectsContainer.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          const action = btn.dataset.action;
          const project = projects.find(p => p.id === id);
          if(!project) return;

          if(action === "open") openProject(project.url);
          if(action === "edit") openEditModal(project);
          if(action === "delete") openDeleteModal(project);
        });
      });
    }

    async function loadProjects(){
      projectsContainer.innerHTML = `<div class="loading">Projects load हो रहे हैं…</div>`;
      clearListMessage();

      try{
        const q = query(collection(db, "projects"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);

        projects = snapshot.docs.map(d => ({
          id: d.id,
          ...d.data()
        }));

        renderProjects();
      }catch(error){
        console.error(error);
        projectsContainer.innerHTML = `
          <div class="empty">
            <div class="empty-icon">⚠️</div>
            <strong>Projects load नहीं हो सके</strong>
            <p>Firestore rules और Firebase configuration check करें।</p>
            <button class="btn btn-primary" id="retryBtn" style="margin-top:12px">Retry</button>
          </div>
        `;
        document.getElementById("retryBtn")?.addEventListener("click", loadProjects);
        showListError(error?.message || "Firestore error");
      }
    }

    function openProject(url){
      if(!validHttpUrl(url)){
        showToast("यह Project URL valid नहीं है।");
        return;
      }
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function openNewModal(){
      modalTitle.textContent = "New Project";
      saveProjectBtn.textContent = "Add Project";
      editProjectId.value = "";
      projectName.value = "";
      projectUrl.value = "";
      iconUrl.value = "";
      projectActive.checked = true;
      updateActiveText();
      projectModal.classList.remove("hidden");
      setTimeout(() => projectName.focus(), 50);
    }

    function openEditModal(project){
      modalTitle.textContent = "Edit Project";
      saveProjectBtn.textContent = "Save Changes";
      editProjectId.value = project.id;
      projectName.value = project.name || "";
      projectUrl.value = project.url || "";
      iconUrl.value = project.iconUrl || "";
      projectActive.checked = project.active !== false;
      updateActiveText();
      projectModal.classList.remove("hidden");
      setTimeout(() => projectName.focus(), 50);
    }

    function closeProjectModal(){
      projectModal.classList.add("hidden");
      projectForm.reset();
      editProjectId.value = "";
      projectActive.checked = true;
      updateActiveText();
    }

    function openDeleteModal(project){
      deleteTargetId = project.id;
      deleteModal.classList.remove("hidden");
    }

    function closeDeleteModal(){
      deleteTargetId = null;
      deleteModal.classList.add("hidden");
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideLoginMessage();

      const password = adminPassword.value;

      if(password === ADMIN_PASSWORD){
        sessionStorage.setItem(ADMIN_SESSION_KEY, "true");
        adminPassword.value = "";
        loginScreen.classList.add("hidden");
        adminApp.classList.remove("hidden");
        await loadProjects();
        return;
      }

      showLoginMessage("गलत Password");
      adminPassword.focus();
    });

    logoutBtn.addEventListener("click", () => {
      sessionStorage.removeItem(ADMIN_SESSION_KEY);
      adminApp.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      adminPassword.value = "";
      hideLoginMessage();
      adminPassword.focus();
    });

    document.getElementById("newProjectBtn").addEventListener("click", openNewModal);
    document.getElementById("refreshBtn").addEventListener("click", loadProjects);

    document.getElementById("closeModalBtn").addEventListener("click", closeProjectModal);
    document.getElementById("cancelModalBtn").addEventListener("click", closeProjectModal);

    projectModal.addEventListener("click", (e) => {
      if(e.target === projectModal) closeProjectModal();
    });

    document.getElementById("closeDeleteBtn").addEventListener("click", closeDeleteModal);
    document.getElementById("cancelDeleteBtn").addEventListener("click", closeDeleteModal);

    deleteModal.addEventListener("click", (e) => {
      if(e.target === deleteModal) closeDeleteModal();
    });

    projectForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = projectName.value.trim();
      const url = projectUrl.value.trim();
      const icon = iconUrl.value.trim();
      const active = projectActive.checked;
      const id = editProjectId.value.trim();

      if(!name){
        showToast("Project Name डालें");
        return;
      }

      if(!validHttpUrl(url)){
        showToast("Project URL valid http/https URL होना चाहिए।");
        return;
      }

      if(icon && !validHttpUrl(icon)){
        showToast("Icon URL valid http/https URL होना चाहिए।");
        return;
      }

      setLoading(saveProjectBtn, true, id ? "Saving…" : "Adding…");

      try{
        if(id){
          await updateDoc(doc(db, "projects", id), {
            name,
            url,
            iconUrl: icon,
            active
          });
          showToast("Project successfully updated");
        }else{
          await addDoc(collection(db, "projects"), {
            name,
            url,
            iconUrl: icon,
            active,
            createdAt: serverTimestamp()
          });
          showToast("Project successfully added");
        }

        closeProjectModal();
        await loadProjects();
      }catch(error){
        console.error(error);
        showToast("Firestore में save नहीं हो सका");
      }finally{
        setLoading(saveProjectBtn, false);
      }
    });

    document.getElementById("confirmDeleteBtn").addEventListener("click", async () => {
      if(!deleteTargetId) return;

      const btn = document.getElementById("confirmDeleteBtn");
      setLoading(btn, true, "Deleting…");

      try{
        await deleteDoc(doc(db, "projects", deleteTargetId));
        closeDeleteModal();
        showToast("Project deleted");
        await loadProjects();
      }catch(error){
        console.error(error);
        showToast("Project delete नहीं हो सका");
      }finally{
        setLoading(btn, false);
      }
    });

    // Restore the admin session until Logout is pressed.
    if(sessionStorage.getItem(ADMIN_SESSION_KEY) === "true"){
      loginScreen.classList.add("hidden");
      adminApp.classList.remove("hidden");
      loadProjects();
    }else{
      adminApp.classList.add("hidden");
      loginScreen.classList.remove("hidden");
    }
  </script>
</body>
</html>
