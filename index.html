<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <meta name="description" content="LKR Hisab - Personal Labour, Mistri aur Site hisab app">
  <title>LKR Hisab</title>
  <link rel="icon" type="image/jpeg" href="https://static.vecteezy.com/system/resources/previews/070/911/474/non_2x/family-home-icon-concept-in-orange-color-vector.jpg">
  <style>
    :root{
      --orange:#f97316;--orange-dark:#ea580c;--orange-soft:#fff7ed;--orange-pale:#ffedd5;
      --bg:#f7f8fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;
      --green:#16a34a;--green-soft:#f0fdf4;--red:#dc2626;--red-soft:#fef2f2;--blue:#2563eb;--blue-soft:#eff6ff;
      --shadow:0 8px 24px rgba(15,23,42,.07);--radius:18px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif
    }
    body{min-height:100vh}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}

    .app{min-height:100vh}
    .topbar{
      position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
      backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
      padding:12px 14px 10px
    }
    .topbar-row{
      max-width:760px;margin:auto;display:flex;align-items:center;
      justify-content:space-between;gap:10px
    }
    .brand{font-weight:850;font-size:21px;letter-spacing:-.4px}
    .brand span{color:var(--orange)}
    .cloud{
      font-size:12px;font-weight:750;padding:7px 10px;border-radius:999px;
      background:#f3f4f6;color:var(--muted);white-space:nowrap
    }
    .cloud.connected,.cloud.saved{background:var(--green-soft);color:var(--green)}
    .cloud.offline{background:#fff7ed;color:#c2410c}
    .cloud.error{background:var(--red-soft);color:var(--red)}

    main{max-width:760px;margin:0 auto;padding:16px 14px 100px}
    .view-title{font-size:25px;font-weight:850;margin:4px 0 3px}
    .subtitle{font-size:13px;color:var(--muted);margin-bottom:16px}

    .monthbar{
      display:flex;align-items:center;justify-content:space-between;
      background:var(--card);border:1px solid var(--border);border-radius:15px;
      padding:7px;margin:0 0 15px;box-shadow:0 3px 12px rgba(15,23,42,.04)
    }
    .monthbar button{
      width:42px;height:42px;border:0;border-radius:12px;
      background:var(--orange-soft);color:var(--orange-dark);font-size:25px
    }
    .month-label{text-align:center;font-weight:800;font-size:16px;flex:1}

    .grid{display:grid;gap:12px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:15px
    }
    .section-title{font-weight:850;font-size:16px;margin:0 0 11px}
    .stat-card{padding:14px}
    .stat-label{font-size:12px;color:var(--muted)}
    .stat-value{font-size:22px;font-weight:850;margin-top:3px}
    .stat-small{font-size:12px;color:var(--muted);margin-top:2px}
    .orange-card{background:linear-gradient(135deg,#fff7ed,#fff)}

    .btn{
      border:0;border-radius:13px;min-height:44px;padding:10px 14px;
      font-weight:800;transition:.15s transform,.15s opacity
    }
    .btn:active{transform:scale(.98)}
    .btn-primary{background:var(--orange);color:#fff}
    .btn-primary:hover{background:var(--orange-dark)}
    .btn-light{background:#f3f4f6;color:var(--text)}
    .btn-danger{background:var(--red-soft);color:var(--red)}
    .btn-success{background:var(--green);color:#fff}
    .btn-outline{background:#fff;color:var(--orange-dark);border:1px solid #fed7aa}
    .btn-block{width:100%}
    .btn-sm{min-height:36px;padding:7px 10px;border-radius:10px;font-size:12px}

    .row{display:flex;align-items:center;gap:10px}
    .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .wrap{flex-wrap:wrap}
    .muted{color:var(--muted)}
    .right{text-align:right}
    .money{font-variant-numeric:tabular-nums}
    .positive{color:var(--green)}
    .negative{color:var(--red)}

    .person-list,.site-list{display:grid;gap:10px}
    .list-item{
      background:#fff;border:1px solid var(--border);
      border-radius:16px;padding:13px
    }
    .avatar{
      width:42px;height:42px;border-radius:13px;background:var(--orange-pale);
      color:var(--orange-dark);display:grid;place-items:center;
      font-weight:900;flex:0 0 auto
    }
    .name{font-weight:850}
    .meta{font-size:12px;color:var(--muted);margin-top:3px}
    .actions{display:flex;gap:7px;margin-top:10px}
    .actions .btn{flex:1}

    .empty{
      padding:28px 14px;text-align:center;color:var(--muted);
      background:#fff;border:1px dashed var(--border);border-radius:16px
    }
    .empty strong{display:block;color:var(--text);margin-bottom:4px}

    label{display:block;font-size:13px;font-weight:750;margin:0 0 6px}
    .field{margin-bottom:13px}
    .input,.select{
      width:100%;min-height:46px;padding:11px 12px;
      border:1px solid #d1d5db;border-radius:12px;
      background:#fff;color:var(--text);outline:none
    }
    .input:focus,.select:focus{
      border-color:var(--orange);
      box-shadow:0 0 0 3px rgba(249,115,22,.12)
    }

    .segmented{
      display:grid;grid-template-columns:repeat(2,1fr);gap:7px;
      background:#f3f4f6;padding:5px;border-radius:13px
    }
    .segmented.three{grid-template-columns:repeat(3,1fr)}
    .seg{
      min-height:42px;border:0;border-radius:9px;background:transparent;
      font-weight:800;color:var(--muted)
    }
    .seg.active{
      background:#fff;color:var(--orange-dark);
      box-shadow:0 2px 7px rgba(15,23,42,.08)
    }

    .bottom-nav{
      position:fixed;z-index:30;left:0;right:0;bottom:0;
      background:rgba(255,255,255,.97);backdrop-filter:blur(14px);
      border-top:1px solid var(--border);
      padding:7px max(8px,env(safe-area-inset-left))
      calc(7px + env(safe-area-inset-bottom));
      display:grid;grid-template-columns:repeat(4,1fr)
    }
    .nav-btn{
      border:0;background:none;color:#6b7280;min-height:52px;
      border-radius:12px;font-size:11px;font-weight:800;
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:3px
    }
    .nav-icon{font-size:21px;line-height:1}
    .nav-btn.active{color:var(--orange-dark);background:var(--orange-soft)}

    .calendar{
      background:#fff;border:1px solid var(--border);
      border-radius:18px;overflow:hidden
    }
    .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}
    .weekday{
      padding:9px 2px;text-align:center;color:var(--muted);
      font-size:11px;font-weight:800;border-bottom:1px solid var(--border)
    }
    .day{
      min-height:65px;border:0;border-right:1px solid var(--border);
      border-bottom:1px solid var(--border);background:#fff;
      padding:5px 3px;text-align:left;position:relative
    }
    .day:nth-child(7n){border-right:0}
    .day.muted-day{background:#fafafa;color:#c4c7cc}
    .day-num{font-size:12px;font-weight:850}
    .day-status{
      font-size:9px;margin-top:4px;font-weight:800;line-height:1.15
    }
    .day.work .day-status{color:var(--green)}
    .day.off .day-status{color:var(--red)}
    .day.has-work{background:#f7fff9}
    .day.selected{
      outline:2px solid var(--orange);
      outline-offset:-2px;z-index:1
    }
    .day.today .day-num{
      display:inline-grid;width:24px;height:24px;place-items:center;
      border-radius:50%;background:var(--orange);color:#fff
    }
    .units-badge{
      position:absolute;right:3px;top:4px;background:var(--orange-pale);
      color:var(--orange-dark);border-radius:8px;padding:2px 4px;
      font-size:9px;font-weight:900
    }

    .work-entry{
      border:1px solid var(--border);border-radius:14px;
      padding:11px;margin-bottom:9px;background:#fff
    }
    .work-entry.off-entry{background:#fafafa}
    .pill{
      display:inline-flex;align-items:center;border-radius:999px;
      padding:4px 8px;font-size:11px;font-weight:800;
      background:#f3f4f6;color:var(--muted)
    }
    .pill.orange{background:var(--orange-soft);color:var(--orange-dark)}
    .pill.green{background:var(--green-soft);color:var(--green)}
    .pill.red{background:var(--red-soft);color:var(--red)}

    .modal-backdrop{
      position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;
      display:flex;align-items:flex-end;justify-content:center
    }
    .modal{
      width:100%;max-width:760px;background:#fff;
      border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;
      padding:16px 14px calc(18px + env(safe-area-inset-bottom));
      box-shadow:0 -12px 35px rgba(15,23,42,.18)
    }
    .modal-head{
      display:flex;justify-content:space-between;
      align-items:center;margin-bottom:15px
    }
    .modal-title{font-size:19px;font-weight:900}
    .close{
      width:38px;height:38px;border:0;border-radius:11px;
      background:#f3f4f6;font-size:21px
    }
    .confirm-text{line-height:1.55;color:#4b5563;font-size:14px}

    .login{
      min-height:100vh;display:grid;place-items:center;padding:22px;
      background:linear-gradient(160deg,#fff7ed 0%,#fff 55%,#f8fafc 100%)
    }
    .login-card{
      width:100%;max-width:420px;background:#fff;
      border:1px solid #fed7aa;border-radius:25px;padding:23px;
      box-shadow:0 20px 60px rgba(15,23,42,.1)
    }
    .login-logo{
      width:62px;height:62px;border-radius:18px;background:var(--orange);
      color:#fff;display:grid;place-items:center;font-weight:950;
      font-size:25px;margin-bottom:14px
    }
    .login h1{font-size:29px;margin:0 0 4px}
    .login p{margin:0 0 22px;color:var(--muted);font-size:14px}
    .login-error{
      background:var(--red-soft);color:var(--red);
      padding:10px;border-radius:11px;font-size:13px;margin-bottom:12px
    }

    .toast{
      position:fixed;z-index:100;left:50%;bottom:84px;
      transform:translateX(-50%);background:#111827;color:#fff;
      padding:10px 14px;border-radius:12px;font-size:13px;font-weight:750;
      box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:90%;
      text-align:center
    }

    .divider{height:1px;background:var(--border);margin:14px 0}
    .info{
      padding:11px 12px;background:var(--blue-soft);color:#1e40af;
      border-radius:12px;font-size:12px;line-height:1.5
    }
    .warning{
      padding:11px 12px;background:#fff7ed;color:#9a3412;
      border-radius:12px;font-size:12px;line-height:1.5
    }
    .summary-row{
      display:flex;justify-content:space-between;gap:12px;
      padding:9px 0;border-bottom:1px solid #f0f0f0
    }
    .summary-row:last-child{border-bottom:0}
    .summary-row span:first-child{color:var(--muted);font-size:13px}
    .summary-row strong{font-size:14px}
    .breakdown{display:grid;gap:8px}
    .breakdown-item{
      display:flex;justify-content:space-between;gap:10px;
      padding:10px;border-radius:12px;background:#fafafa
    }
    .small{font-size:12px}
    .sticky-actions{
      position:sticky;bottom:0;background:#fff;padding-top:10px
    }

    @media(min-width:700px){
      .bottom-nav{
        left:50%;right:auto;transform:translateX(-50%);
        width:min(760px,100%);border-left:1px solid var(--border);
        border-right:1px solid var(--border);
        border-radius:18px 18px 0 0
      }
      .modal-backdrop{align-items:center;padding:20px}
      .modal{border-radius:22px;max-height:88vh}
      .toast{bottom:95px}
    }
  </style>
</head>

<body>
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
(() => {
  'use strict';

  const firebaseConfig = {
    apiKey: "AIzaSyAz4vnf3BJ_Hs54lksg3Og8n5a7fr7DhyU",
    authDomain: "lkr-hisab.firebaseapp.com",
    projectId: "lkr-hisab",
    storageBucket: "lkr-hisab.firebasestorage.app",
    messagingSenderId: "1054769717706",
    appId: "1:1054769717706:web:b6011c1a2023c6dc7b2f33"
  };

  const APP_USER = {
    name: 'Shivam Kumar',
    password: '14141414',
    id: 'shivam-kumar'
  };

  const LOGIN_KEY = 'lkr_hisab_logged_in';
  const CACHE_KEY = 'lkr_hisab_cache_v1';

  const state = {
    loggedIn: false,
    view: 'home',
    month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    people: [],
    sites: [],
    works: [],
    selectedPersonId: null,
    selectedSiteId: null,
    selectedDate: null,
    cloud: 'offline',
    loaded: false,
    modal: null,
    editing: null,
    loginError: '',
    busy: false
  };

  let db = null;
  let unsubscribe = null;

  const $ = id => document.getElementById(id);

  const esc = value =>
    String(value ?? '').replace(/[&<>'"]/g, c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c]));

  const money = n =>
    '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');

  const units = n =>
    Number(n || 0).toLocaleString('en-IN', {
      maximumFractionDigits:2
    });

  const uid = () =>
    (crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);

  const pad = n => String(n).padStart(2,'0');

  const dateKey = d =>
    `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

  const parseDate = s => {
    const [y,m,d] = String(s).split('-').map(Number);
    return new Date(y,m-1,d);
  };

  const monthKey = d =>
    `${d.getFullYear()}-${pad(d.getMonth()+1)}`;

  const monthLabel = d =>
    d.toLocaleDateString('en-IN',{
      month:'long',
      year:'numeric'
    });

  const isSameMonth = (date, month) =>
    date.getFullYear()===month.getFullYear() &&
    date.getMonth()===month.getMonth();

  const firstOfMonth = d =>
    new Date(d.getFullYear(),d.getMonth(),1);

  const getPerson = id =>
    state.people.find(p => p.id === id);

  const getSite = id =>
    state.sites.find(s => s.id === id);

  const worksInMonth = (month=state.month) =>
    state.works.filter(w =>
      String(w.date).startsWith(monthKey(month))
    );

  const workForPersonMonth = (personId, month=state.month) =>
    worksInMonth(month).filter(w => w.personId===personId);

  const activeWorkEntries = (personId, month=state.month) =>
    workForPersonMonth(personId,month)
      .filter(w => w.status==='work');

  const personUnits = (personId, month=state.month) =>
    activeWorkEntries(personId,month)
      .reduce((s,w)=>s+Number(w.units||0),0);

  const personPayment = (personId, month=state.month) =>
    activeWorkEntries(personId,month)
      .reduce((s,w)=>s+(w.paymentYes ? Number(w.paymentAmount||0) : 0),0);

  const personBana = (personId, month=state.month) => {
    const p=getPerson(personId);
    return (p ? Number(p.rate||0) : 0) *
      personUnits(personId,month);
  };

  const personBalance = (personId, month=state.month) =>
    personBana(personId,month)-personPayment(personId,month);

  function setCloud(status){
    state.cloud=status;
    const el=$('cloudStatus');
    if(!el)return;

    const map={
      connected:['☁ Cloud • Connected','connected'],
      saved:['☁ Cloud • Saved','saved'],
      offline:['☁ Cloud • Offline','offline'],
      error:['☁ Sync error','error']
    };

    el.textContent=map[status]?.[0] || '☁ Cloud • Offline';
    el.className='cloud '+(map[status]?.[1] || '');
  }

  function saveLocalCache(){
    try{
      localStorage.setItem(
        CACHE_KEY,
        JSON.stringify({
          people:state.people,
          sites:state.sites,
          works:state.works
        })
      );
    }catch(e){}
  }

  function loadLocalCache(){
    try{
      const raw=localStorage.getItem(CACHE_KEY);
      if(!raw)return;

      const d=JSON.parse(raw);

      state.people=Array.isArray(d.people) ? d.people : [];
      state.sites=Array.isArray(d.sites) ? d.sites : [];
      state.works=Array.isArray(d.works) ? d.works : [];
    }catch(e){}
  }

  async function initFirebase(){
    try{
      if(!firebase.apps.length){
        firebase.initializeApp(firebaseConfig);
      }

      db=firebase.firestore();
      setCloud('connected');
      return true;
    }catch(e){
      console.error(e);
      setCloud('error');
      return false;
    }
  }

  const userRef = () =>
    db.collection('users').doc(APP_USER.id);

  const col = name =>
    userRef().collection(name);

  async function ensureUserDoc(){
    try{
      await userRef().set({
        name:APP_USER.name,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      },{
        merge:true
      });
    }catch(e){
      console.warn('user doc',e);
    }
  }

  async function loadFirestore(){
    if(!db)return false;

    state.busy=true;
    render();

    try{
      const [
        sitesSnap,
        peopleSnap,
        worksSnap
      ]=await Promise.all([
        col('sites').get(),
        col('people').get(),
        col('works').get()
      ]);

      state.sites=sitesSnap.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      state.people=peopleSnap.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      state.works=worksSnap.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      saveLocalCache();
      state.loaded=true;
      setCloud('saved');

      state.busy=false;
      render();

      return true;
    }catch(e){
      console.error(e);
      setCloud('error');
      state.loaded=true;
      state.busy=false;
      render();

      toast('Firestore load नहीं हो पाया। Cache से app चला रहा हूँ।');
      return false;
    }
  }

  async function saveDoc(collectionName,item){
    if(!db){
      setCloud('error');
      throw new Error('Firebase unavailable');
    }

    await col(collectionName)
      .doc(item.id)
      .set({
        ...item,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      },{
        merge:true
      });
  }

  async function deleteDoc(collectionName,id){
    if(!db){
      throw new Error('Firebase unavailable');
    }

    await col(collectionName).doc(id).delete();
  }

  async function persistAdd(collectionName,item){
    state[collectionName].push(item);
    saveLocalCache();
    render();

    try{
      await saveDoc(collectionName,item);
      setCloud('saved');
    }catch(e){
      setCloud('error');
      toast('Cloud save fail हुआ। Internet/Firestore rules check करें।');
    }
  }

  async function persistUpdate(collectionName,item){
    const arr=state[collectionName];
    const i=arr.findIndex(x=>x.id===item.id);

    if(i>=0)arr[i]=item;

    saveLocalCache();
    render();

    try{
      await saveDoc(collectionName,item);
      setCloud('saved');
    }catch(e){
      setCloud('error');
      toast('Cloud update fail हुआ।');
    }
  }

  async function persistDelete(collectionName,id){
    const arr=state[collectionName];
    const i=arr.findIndex(x=>x.id===id);

    if(i>=0)arr.splice(i,1);

    saveLocalCache();
    render();

    try{
      await deleteDoc(collectionName,id);
      setCloud('saved');
    }catch(e){
      setCloud('error');
      toast('Cloud delete fail हुआ।');
    }
  }

  function monthNav(){
    return `
      <div class="monthbar">
        <button aria-label="Previous month" onclick="changeMonth(-1)">‹</button>
        <div class="month-label">${esc(monthLabel(state.month))}</div>
        <button aria-label="Next month" onclick="changeMonth(1)">›</button>
      </div>
    `;
  }

  window.changeMonth = delta => {
    state.month=new Date(
      state.month.getFullYear(),
      state.month.getMonth()+delta,
      1
    );

    state.selectedDate=null;
    render();
  };

  function render(){
    const root=$('root');

    if(!state.loggedIn){
      root.innerHTML=loginHtml();
      return;
    }

    root.innerHTML=`
      <div class="app">
        <header class="topbar">
          <div class="topbar-row">
            <div class="brand">LKR <span>Hisab</span></div>
            <div id="cloudStatus" class="cloud"></div>
          </div>
        </header>

        <main id="main"></main>

        <nav class="bottom-nav">
          ${navButton('home','⌂','Home')}
          ${navButton('people','👷','Labour/Mistri')}
          ${navButton('sites','🏠','Owner/Site')}
          ${navButton('more','☰','More')}
        </nav>

        <div id="modalRoot"></div>
        <div id="toastRoot"></div>
      </div>
    `;

    setCloud(state.cloud);
    renderMain();

    if(state.modal){

  function typeStats(type,month){
    const ps=state.people.filter(p=>p.type===type);

    let count=0;
    let u=0;
    let b=0;
    let pay=0;

    ps.forEach(p=>{
      const pu=personUnits(p.id,month);

      if(pu>0)count++;

      u+=pu;
      b+=personBana(p.id,month);
      pay+=personPayment(p.id,month);
    });

    return {
      count,
      units:u,
      bana:b,
      payment:pay
    };
  }

  function commissionStats(month){
    let labour=0;
    let mistri=0;

    worksInMonth(month)
      .filter(w=>w.status==='work')
      .forEach(w=>{
        const p=getPerson(w.personId);
        const s=getSite(w.siteId);

        if(!p||!s)return;

        const ownerRate=
          p.type==='Labour'
            ? Number(s.labourRate||0)
            : Number(s.mistriRate||0);

        const diff=ownerRate-Number(p.rate||0);

        if(p.type==='Labour'){
          labour+=diff*Number(w.units||0);
        }
        else{
          mistri+=diff*Number(w.units||0);
        }
      });

    return {
      labour,
      mistri,
      total:labour+mistri
    };
  }

  function calendarHtml(personId){

    const first=firstOfMonth(state.month);
    const start=new Date(first);

    start.setDate(1-first.getDay());

    const days=[];

    for(let i=0;i<42;i++){

      const d=new Date(start);
      d.setDate(start.getDate()+i);

      const key=dateKey(d);

      const ws=state.works.filter(
        w=>w.personId===personId&&w.date===key
      );

      const work=ws.filter(
        w=>w.status==='work'
      );

      const off=ws.some(
        w=>w.status==='off'
      );

      const u=work.reduce(
        (s,w)=>s+Number(w.units||0),
        0
      );

      const classes=[
        isSameMonth(d,state.month)?'':'muted-day',
        work.length?'has-work':'',
        off&&!work.length?'off':'',
        state.selectedDate===key?'selected':'',
        dateKey(new Date())===key?'today':''
      ].join(' ');

      days.push(`
        <button
          class="day ${classes}"
          onclick="selectWorkDate('${key}')"
        >
          <div class="day-num">${d.getDate()}</div>

          ${
            u
              ? `<span class="units-badge">${units(u)}</span>`
              : ''
          }

          <div class="day-status">
            ${
              work.length
                ? `काम${work.length>1?' ×'+work.length:''}`
                : off
                  ? 'छुट्टी'
                  : ''
            }
          </div>
        </button>
      `);
    }

    return `
      <div class="calendar">

        <div class="weekdays">
          <div class="weekday">रवि</div>
          <div class="weekday">सोम</div>
          <div class="weekday">मंगल</div>
          <div class="weekday">बुध</div>
          <div class="weekday">गुरु</div>
          <div class="weekday">शुक्र</div>
          <div class="weekday">शनि</div>
        </div>

        <div class="days">
          ${days.join('')}
        </div>

      </div>
    `;
  }

      id:uid(),

      type:getPerson(personId)?.type||'',
      date,

      siteId:null,
      units:0,
      paymentYes:false,

  function siteTypeStats(siteId,type){

    const list=worksInMonth(state.month)
      .filter(w=>
        w.siteId===siteId &&
        w.status==='work' &&
        getPerson(w.personId)?.type===type
      );

    const by={};
    let u=0;

    list.forEach(w=>{

      const p=getPerson(w.personId);

      u+=Number(w.units||0);

      if(!by[p.id]){
        by[p.id]={
          person:p,
          units:0
        };
      }

      by[p.id].units+=Number(w.units||0);
    });

    const s=getSite(siteId);

    const rate=
      type==='Labour'
        ? Number(s?.labourRate||0)
        : Number(s?.mistriRate||0);

    return {
      units:u,
      amount:u*rate,
      rate,
      by:Object.values(by)
    };
  }

  function commissionPage(){

    const c=commissionStats(state.month);

    const rows=worksInMonth(state.month)
      .filter(w=>w.status==='work')
      .map(w=>{

        const p=getPerson(w.personId);
        const s=getSite(w.siteId);

        if(!p||!s)return null;

        const ownerRate=
          p.type==='Labour'
            ? Number(s.labourRate||0)
            : Number(s.mistriRate||0);

        const value=
          (ownerRate-Number(p.rate||0)) *
          Number(w.units||0);

        return {
          p,
          s,
          w,
          ownerRate,
          value
        };
      })
      .filter(Boolean);

          ${
            rows.length
              ? rows.map(r=>`
                  <div class="breakdown-item">

                    <div>

                      <strong>
                        ${esc(r.p.name)}
                      </strong>

                      <div class="small muted">
                        ${esc(r.s.name)}

                    </div>

                    <div class="right">

  window.saveWork=async()=>{

    const m=state.modal;

    if(!m)return;

    const status=$('workStatus').value;

    if(status==='off'){

      const same=state.works.filter(
        w=>
          w.personId===m.personId &&
          w.date===m.date
      );

      if(same.length){
        return toast(
          'इस date पर existing work entries हैं। पहले उन्हें delete करें, फिर Chhutti save करें।'
        );
      }

      const item={
        id:uid(),
        personId:m.personId,
        type:getPerson(m.personId)?.type||'',
        date:m.date,
        status:'off',
        siteId:null,
        units:0,
        paymentYes:false,
        paymentAmount:0
      };

      state.modal=null;

      await persistAdd('works',item);
      render();

      return;
    }

    const siteId=$('workSite').value;

    if(!siteId){
      return toast(
        'Owner/Site चुनें।'
      );
    }

    const paymentYes=
      $('paymentYes').value==='1';

    const paymentAmount=
      paymentYes
        ? Number($('paymentAmount').value||0)
        : 0;

    const item={
      id:uid(),
      personId:m.personId,
      type:getPerson(m.personId)?.type||'',
      date:m.date,
      status:'work',
      siteId,
      units:Number($('workUnits').value),
      paymentYes,
      paymentAmount
    };

    /*
      selectedDate को जानबूझकर clear नहीं किया गया।
      इसलिए Save के बाद उसी date पर वापस आकर
      "+ दूसरी जगह का काम जोड़ें" दिखेगा।
    */
    state.modal=null;

    await persistAdd('works',item);
    render();
  };

    else if(m.action==='deletePerson'){

      const related=state.works
        .filter(w=>w.personId===m.id)
        .map(w=>w.id);

      for(const id of related){
        await persistDelete(
          'works',
          id
        );
      }

      await persistDelete(
        'people',
        m.id
      );

      if(state.selectedPersonId===m.id){
        state.selectedPersonId=null;
      }
    }

    else if(m.action==='deleteSite'){

      const related=state.works
        .filter(w=>w.siteId===m.id)
        .map(w=>w.id);

      for(const id of related){
        await persistDelete(
          'works',
          id
        );
      }

      await persistDelete(
        'sites',
        m.id
      );

      if(state.selectedSiteId===m.id){
        state.selectedSiteId=null;
      }
    }

    render();
  };

  /*
    Toast helper
  */
  function toast(message){

    const root=$('toastRoot');

    if(!root)return;

    root.innerHTML=`
      <div class="toast">
        ${esc(message)}
      </div>
    `;

    clearTimeout(window.__lkrToastTimer);

    window.__lkrToastTimer=setTimeout(()=>{
      if(root)root.innerHTML='';
    },2600);
  }

  /*
    Restore login across refresh/browser reopen.
    Firestore is always reloaded when possible.
  */
  async function boot(){

    const logged=
      localStorage.getItem(LOGIN_KEY)==='1';

    if(!logged){
      render();
      return;
    }

    state.loggedIn=true;

    loadLocalCache();
    render();

    const ok=await initFirebase();

    if(ok){
      await ensureUserDoc();
      await loadFirestore();
    }
  }

  window.addEventListener(
    'online',
    ()=>{
      if(state.loggedIn){
        setCloud('connected');
      }
    }
  );

  window.addEventListener(
    'offline',
    ()=>{
      setCloud('offline');
    }
  );

  boot();

})();
</script>
</body>
</html>
