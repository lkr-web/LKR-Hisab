<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>RLC,L — R Lal College, Lakhisarai</title>

<style>
:root{
  --o:#f97316;
  --od:#ea580c;
  --ol:#fff7ed;
  --bg:#f8fafc;
  --c:#fff;
  --t:#111827;
  --m:#6b7280;
  --b:#e5e7eb;
  --sh:0 12px 35px rgba(15,23,42,.08)
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--t)
}

button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.welcome{
  background:
    radial-gradient(circle at 85% 10%,rgba(249,115,22,.2),transparent 35%),
    radial-gradient(circle at 10% 90%,rgba(251,146,60,.12),transparent 32%),
    var(--bg)
}

.panel{
  width:min(100%,440px);
  background:#fff;
  border:1px solid var(--b);
  border-radius:30px;
  box-shadow:var(--sh);
  padding:28px 22px;
  text-align:center
}

.logo{
  width:78px;
  height:78px;
  margin:0 auto 18px;
  border-radius:24px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:27px;
  font-weight:900;
  background:linear-gradient(135deg,var(--o),var(--od));
  box-shadow:0 12px 26px rgba(249,115,22,.25)
}

.panel h1{
  font-size:27px;
  margin:0 0 7px
}

.subtitle{
  font-size:14px;
  color:var(--m);
  margin:0 0 26px
}

.question{
  font-size:20px;
  font-weight:800;
  margin:0 0 22px
}

.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.btn{
  min-height:50px;
  border:0;
  border-radius:14px;
  padding:0 18px;
  font-weight:800;
  transition:.18s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px
}

.btn:active{transform:scale(.98)}

.btn-primary{
  color:#fff;
  background:linear-gradient(135deg,var(--o),var(--od));
  box-shadow:0 9px 20px rgba(249,115,22,.22)
}

.btn-light{
  background:#f3f4f6;
  color:#374151
}

.btn-wide{width:100%}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed
}

.field{
  text-align:left;
  margin-bottom:16px
}

label{
  display:block;
  font-size:14px;
  font-weight:800;
  margin-bottom:8px
}

input{
  width:100%;
  height:51px;
  border:1px solid #d1d5db;
  border-radius:14px;
  outline:none;
  padding:0 14px;
  background:#fff;
  color:var(--t);
  transition:.2s
}

input:focus{
  border-color:var(--o);
  box-shadow:0 0 0 4px rgba(249,115,22,.12)
}

.hint{
  font-size:12px;
  color:var(--m);
  margin-top:6px
}

.message{
  padding:11px 13px;
  border-radius:12px;
  margin-bottom:16px;
  text-align:left;
  font-size:13px;
  font-weight:700
}

.message.error{
  background:#fef2f2;
  color:#b91c1c;
  border:1px solid #fecaca
}

#homeScreen{
  min-height:100vh
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--b)
}

.topbar-inner{
  width:min(100%,1080px);
  min-height:68px;
  margin:auto;
  padding:9px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0
}

.brand-logo{
  width:44px;
  height:44px;
  border-radius:15px;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:900;
  font-size:16px;
  background:linear-gradient(135deg,var(--o),var(--od));
  flex:none
}

.brand h1{
  font-size:19px;
  margin:0
}

.brand p{
  font-size:11px;
  color:var(--m);
  margin:2px 0 0
}

.user-badge{
  background:var(--ol);
  color:var(--od);
  border:1px solid #fed7aa;
  padding:8px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}

main{
  width:min(100%,1080px);
  margin:auto;
  padding:14px 12px 34px
}

.hero{
  border:1px solid #fed7aa;
  border-radius:20px;
  background:linear-gradient(135deg,#fff7ed,#fff);
  padding:17px 15px;
  margin-bottom:16px
}

.hero h2{
  margin:0 0 5px;
  font-size:23px;
  line-height:1.2
}

.hero p{
  margin:0;
  color:var(--m);
  font-size:13px;
  line-height:1.45
}

.section-title{
  font-size:18px;
  margin:0 0 11px
}

.projects-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:12px
}

.project-card{
  min-width:0;
  background:#fff;
  border:1px solid var(--b);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(15,23,42,.055);
  animation:up .4s ease both
}

.media-wrap{
  width:100%;
  aspect-ratio:16/9;
  background:#f3f4f6;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center
}

.media-wrap img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  background:#f3f4f6
}

.media-wrap video{
  width:100%;
  height:100%;
  display:block;
  background:#000;
  object-fit:contain
}

.media-wrap iframe{
  width:100%;
  height:100%;
  display:block;
  border:0;
  background:#000
}

.project-body{
  padding:14px
}

.project-title-row{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0
}

.project-icon{
  width:54px;
  height:54px;
  border-radius:15px;
  object-fit:cover;
  object-position:center;
  background:var(--ol);
  border:1px solid #fed7aa;
  flex:0 0 54px;
  display:block
}

.project-name{
  font-size:17px;
  line-height:1.3;
  margin:0;
  font-weight:850;
  overflow-wrap:anywhere;
  min-width:0
}

.description{
  color:#4b5563;
  font-size:13.5px;
  line-height:1.55;
  white-space:pre-line;
  overflow-wrap:anywhere;
  margin:11px 0 14px
}

.open-btn{
  width:100%;
  min-height:50px
}

.state{
  background:#fff;
  border:1px dashed #d1d5db;
  border-radius:18px;
  padding:36px 16px;
  text-align:center;
  color:var(--m)
}

.state-icon{
  font-size:38px;
  margin-bottom:8px
}

.state strong{
  color:var(--t);
  display:block;
  margin-bottom:5px
}

.spinner{
  width:35px;
  height:35px;
  border-radius:50%;
  border:4px solid #fed7aa;
  border-top-color:var(--o);
  animation:spin .8s linear infinite;
  margin:0 auto 13px
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  z-index:100;
  max-width:calc(100% - 30px);
  padding:12px 16px;
  border-radius:13px;
  color:#fff;
  background:#111827;
  font-size:13px;
  font-weight:700;
  text-align:center;
  transform:translate(-50%,120px);
  opacity:0;
  transition:.25s
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes up{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

@media(min-width:700px){
  .panel{padding:34px}
  .projects-grid{
    grid-template-columns:repeat(2,1fr)
  }
  main{padding-top:28px}
}

@media(min-width:980px){
  .projects-grid{
    grid-template-columns:repeat(3,1fr)
  }
}

@media(max-width:360px){

.auth-tabs{

  font-weight:850;

}
</style>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  addDoc,
  updateDoc,
  doc,
  serverTimestamp,
  limit
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBlyhlVW2ETT36wfSeTRMKkWz1oLvTFvgo",
  authDomain: "lkr-link.firebaseapp.com",
  projectId: "lkr-link",
  storageBucket: "lkr-link.firebasestorage.app",
  messagingSenderId: "1041567842519",
  appId: "1:1041567842519:web:84dcee0602f9831d0bb092"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================================================
   SETTINGS
========================================================= */

const USER_ID_KEY = "rlcl_user_id";

const HEARTBEAT_MS = 30000;

let currentUserId =
  localStorage.getItem(USER_ID_KEY);

let heartbeatTimer = null;

let toastTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const $ = id =>
  document.getElementById(id);


const collegeScreen =
  $("collegeScreen");

const authScreen =
  $("authScreen");

const homeScreen =
  $("homeScreen");

const authMessage =
  $("authMessage");

const registerForm =
  $("registerForm");

const loginForm =
  $("loginForm");

const registerTab =
  $("registerTab");

const loginTab =
  $("loginTab");

const registerBtn =
  $("registerBtn");

const loginBtn =
  $("loginBtn");

const registerName =
  $("registerName");

const registerMobile =
  $("registerMobile");

const loginName =
  $("loginName");

const loginMobile =
  $("loginMobile");

const projectsContainer =
  $("projectsContainer");

const toast =
  $("toast");


/* =========================================================
   TOAST
========================================================= */

function toastMsg(message){

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    },2600);
}


/* =========================================================
   AUTH MESSAGE
========================================================= */

function authMsg(message){

  authMessage.textContent =
    message;

  authMessage.classList.remove("hidden");
}


function hideAuthMsg(){

  authMessage.classList.add("hidden");

  authMessage.textContent = "";
}


/* =========================================================
   BUTTON LOADING
========================================================= */

function loading(button,isLoading,text){

  if(isLoading){

    button.dataset.old =
      button.textContent;

    button.disabled = true;

    button.textContent = text;

  }else{

    button.disabled = false;

    button.textContent =
      button.dataset.old ||
      button.textContent;
  }
}


/* =========================================================
   MOBILE NUMBER
========================================================= */

function mobile(value){

  return value
    .replace(/\D/g,"")
    .slice(0,10);
}


[registerMobile,loginMobile]
.forEach(input => {

  input.addEventListener(
    "input",
    () => {

      input.value =
        mobile(input.value);

    }
  );

});


/* =========================================================
   URL CHECK
========================================================= */

function valid(url){

  try{

    const x =
      new URL(url);

    return (
      x.protocol === "http:" ||
      x.protocol === "https:"
    );

  }catch{

    return false;

  }

}


/* =========================================================
   DEFAULT ICON
========================================================= */

function icon(){

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 120 120">

        <defs>

          <linearGradient
            id="g"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop
              offset="0"
              stop-color="#f97316"/>

            <stop
              offset="1"
              stop-color="#ea580c"/>

          </linearGradient>

        </defs>

        <rect
          width="120"
          height="120"
          rx="28"
          fill="url(#g)"/>

        <text
          x="60"
          y="77"
          text-anchor="middle"
          font-family="Arial"
          font-size="43"
          font-weight="900"
          fill="#fff">
          RLC
        </text>

      </svg>
    `);

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   DIRECT VIDEO DETECTION
========================================================= */

function isDirectVideo(url){

  if(!url) return false;

  try{

    const clean =
      url.split("?")[0]
         .split("#")[0]
         .toLowerCase();

    return (
      clean.endsWith(".mp4") ||
      clean.endsWith(".webm") ||
      clean.endsWith(".ogg") ||
      clean.endsWith(".ogv") ||
      clean.endsWith(".mov") ||
      clean.endsWith(".m4v")
    );

  }catch{

    return false;

  }

}


/* =========================================================
   YOUTUBE VIDEO ID
========================================================= */

function youtubeId(url){

  if(!url) return null;

  try{

    const u =
      new URL(url);

    const host =
      u.hostname
        .toLowerCase()
        .replace(/^www\./,"")
        .replace(/^m\./,"");

    /* youtube.com/watch?v= */
    if(
      host === "youtube.com" ||
      host === "youtube-nocookie.com"
    ){

      const v =
        u.searchParams.get("v");

      if(v) return v;


      /* /shorts/VIDEO_ID */
      const shorts =
        u.pathname.match(
          /\/shorts\/([^/?#]+)/
        );

      if(shorts){
        return shorts[1];
      }


      /* /embed/VIDEO_ID */
      const embed =
        u.pathname.match(
          /\/embed\/([^/?#]+)/
        );

      if(embed){
        return embed[1];
      }


      /* /live/VIDEO_ID */
      const live =
        u.pathname.match(
          /\/live\/([^/?#]+)/
        );

      if(live){
        return live[1];
      }

    }


    /* youtu.be/VIDEO_ID */
    if(host === "youtu.be"){

      const id =
        u.pathname
          .split("/")
          .filter(Boolean)[0];

      if(id) return id;

    }


  }catch{

    return null;

  }

  return null;

}


/* =========================================================
   MEDIA RENDER
========================================================= */

function media(url,name){

  if(!url || !valid(url)){
    return "";
  }


  const yt =
    youtubeId(url);


  /* -------------------------
     YOUTUBE
  ------------------------- */

  if(yt){

    const embedUrl =
      "https://www.youtube.com/embed/" +
      encodeURIComponent(yt) +
      "?rel=0";

    return `
      <div class="media-wrap">

        <iframe
          src="${esc(embedUrl)}"
          title="${esc(name)}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>

      </div>
    `;

  }


  /* -------------------------
     DIRECT VIDEO
  ------------------------- */

  if(isDirectVideo(url)){

    return `
      <div class="media-wrap">

        <video
          controls
          preload="metadata"
          playsinline
          aria-label="${esc(name)} video">

          <source
            src="${esc(url)}">

          आपका browser video playback support नहीं करता।

        </video>

      </div>
    `;

  }


  /* -------------------------
     IMAGE
  ------------------------- */

  return `
    <div class="media-wrap">

      <img
        src="${esc(url)}"
        alt="${esc(name)} media"
        onerror="this.closest('.media-wrap')?.remove()">

    </div>
  `;

}


/* =========================================================
   RENDER PROJECTS
========================================================= */

function render(projects){

  if(!projects.length){

    projectsContainer.innerHTML = `
      <div class="state">

        <div class="state-icon">
          📁
        </div>

        <strong>
          अभी कोई Project उपलब्ध नहीं है
        </strong>

        <span>
          Projects यहाँ दिखाई देंगे।
        </span>

      </div>
    `;

    return;
  }


  projectsContainer.innerHTML = `

    <div class="projects-grid">

      ${projects.map((p,i)=>{

        const projectIcon =
          valid(p.iconUrl)
            ? p.iconUrl
            : icon();


        return `

          <article
            class="project-card"
            style="animation-delay:${Math.min(i*45,250)}ms">

            ${media(
              p.mediaUrl,
              p.name
            )}


            <div class="project-body">

              <div class="project-title-row">

                <img
                  class="project-icon"
                  src="${esc(projectIcon)}"
                  alt="${esc(p.name)} icon"
                  onerror="this.onerror=null;this.src='${icon()}'">

                <h3 class="project-name">
                  ${esc(p.name)}
                </h3>

              </div>


              ${
                p.description
                ?
                `
                  <div class="description">
                    ${esc(p.description)}
                  </div>
                `
                :
                ""
              }


              <button
                class="btn btn-primary open-btn"
                data-url="${esc(p.url)}">

                Open

              </button>

            </div>

          </article>

        `;

      }).join("")}

    </div>

  `;


  projectsContainer
    .querySelectorAll(".open-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const url =
            button.dataset.url;


          if(!valid(url)){

            toastMsg(
              "Project URL valid नहीं है।"
            );

            return;
          }


          window.open(
            url,
            "_blank",
            "noopener,noreferrer"
          );

        }
      );

    });

}


/* =========================================================
   LOAD PROJECTS
========================================================= */

async function loadProjects(){

  projectsContainer.innerHTML = `

    <div class="state">

      <div class="spinner"></div>

      <strong>
        Projects load हो रहे हैं…
      </strong>

      <span>
        कृपया थोड़ा इंतज़ार करें।
      </span>

    </div>

  `;


  try{

    const snapshot =
      await getDocs(

        query(
          collection(db,"projects"),
          where("active","==",true)
        )

      );


    const projects =
      snapshot.docs.map(
        document => ({
          id:document.id,
          ...document.data()
        })
      );


    projects.sort(
      (a,b)=>
        (b.createdAt?.toMillis?.() || 0) -
        (a.createdAt?.toMillis?.() || 0)
    );


    render(projects);


  }catch(error){

    console.error(error);


    projectsContainer.innerHTML = `

      <div class="state">

        <div class="state-icon">
          ⚠️
        </div>

        <strong>
          Projects load नहीं हो सके
        </strong>

        <span>
          Internet/Firebase connection check करें।
        </span>

        <br>

        <button
          class="btn btn-primary"
          id="retry"
          style="margin-top:14px">

          Retry

        </button>

      </div>

    `;


    $("retry")?.addEventListener(
      "click",
      loadProjects
    );

  }

}


/* =========================================================
   SHOW AUTH
========================================================= */

function showAuth(tab="register"){

  collegeScreen.classList.add("hidden");

  homeScreen.classList.add("hidden");

  authScreen.classList.remove("hidden");

  setAuthTab(tab);

}


/* =========================================================
   AUTH TAB
========================================================= */

function setAuthTab(tab){

  hideAuthMsg();


  const isLogin =
    tab === "login";


  registerTab.classList.toggle(
    "active",
    !isLogin
  );


  loginTab.classList.toggle(
    "active",
    isLogin
  );


  registerForm.classList.toggle(
    "hidden",
    isLogin
  );


  loginForm.classList.toggle(
    "hidden",
    !isLogin
  );


  setTimeout(
    () => {

      $(
        isLogin
          ? "loginName"
          : "registerName"
      )?.focus();

    },
    50
  );

}


/* =========================================================
   REGISTER
========================================================= */

async function registerUser(){

  hideAuthMsg();


  const name =
    registerName.value.trim();


  const mobileNumber =
    mobile(registerMobile.value);


  if(name.length < 2){

    return authMsg(
      "कृपया अपना Full Name डालें।"
    );

  }


  if(!/^\d{10}$/.test(mobileNumber)){

    return authMsg(
      "कृपया 10 अंकों का Mobile Number डालें।"
    );

  }


  loading(
    registerBtn,
    true,
    "Register हो रहा है…"
  );


  try{

    const existing =
      await getDocs(

        query(
          collection(db,"users"),
          where(
            "mobileNumber",
            "==",
            mobileNumber
          ),
          limit(1)
        )

      );


    if(!existing.empty){

      authMsg(
        "यह Mobile Number पहले से Registered है। कृपया Login करें।"
      );

      return;
    }


    const result =
      await addDoc(
        collection(db,"users"),
        {
          fullName:name,
          mobileNumber:mobileNumber,
          registeredAt:serverTimestamp(),
          lastSeen:serverTimestamp(),
          active:true
        }
      );


    currentUserId =
      result.id;


    localStorage.setItem(
      USER_ID_KEY,
      currentUserId
    );


    goHome();


  }catch(error){

    console.error(error);


    authMsg(
      "Registration नहीं हो सका। कृपया Internet connection check करके फिर कोशिश करें।"
    );

  }finally{

    loading(
      registerBtn,
      false
    );

  }

}


/* =========================================================
   LOGIN
========================================================= */

async function loginUser(){

  hideAuthMsg();


  const name =
    loginName.value.trim();


  const mobileNumber =
    mobile(loginMobile.value);


  if(name.length < 2){

    return authMsg(
      "कृपया अपना Full Name डालें।"
    );

  }


  if(!/^\d{10}$/.test(mobileNumber)){

    return authMsg(
      "कृपया 10 अंकों का Mobile Number डालें।"
    );

  }


  loading(
    loginBtn,
    true,
    "Login हो रहा है…"
  );


  try{

    const snapshot =
      await getDocs(

        query(
          collection(db,"users"),
          where(
            "mobileNumber",
            "==",
            mobileNumber
          ),
          limit(1)
        )

      );


    if(snapshot.empty){

      authMsg(
        "यह Mobile Number Registered नहीं है। पहले Register करें।"
      );

      return;
    }


    const document =
      snapshot.docs[0];


    const user =
      document.data();


    if(
      String(user.fullName || "")
        .trim()
        .toLowerCase()
      !==
      name
        .toLowerCase()
    ){

      authMsg(
        "Full Name और Mobile Number Registered details से match नहीं करते।"
      );

      return;
    }


    await updateDoc(
      doc(db,"users",document.id),
      {
        lastSeen:serverTimestamp(),
        active:true
      }
    );


    currentUserId =
      document.id;


    localStorage.setItem(
      USER_ID_KEY,
      currentUserId
    );


    goHome();


  }catch(error){

    console.error(error);


    authMsg(
      "Login नहीं हो सका। कृपया Internet connection check करके फिर कोशिश करें।"
    );

  }finally{

    loading(
      loginBtn,
      false
    );

  }

}


/* =========================================================
   HEARTBEAT
========================================================= */

async function heartbeat(){

  if(!currentUserId){
    return;
  }


  try{

    await updateDoc(
      doc(db,"users",currentUserId),
      {
        lastSeen:serverTimestamp(),
        active:true
      }
    );

  }catch(error){

    console.warn(
      "Heartbeat failed",
      error
    );

  }

}


/* =========================================================
   START HEARTBEAT
========================================================= */

function startHeartbeat(){

  if(heartbeatTimer){

    clearInterval(
      heartbeatTimer
    );

  }


  heartbeat();


  heartbeatTimer =
    setInterval(
      heartbeat,
      HEARTBEAT_MS
    );

}


/* =========================================================
   GO HOME
========================================================= */

function goHome(){

  collegeScreen.classList.add("hidden");

  authScreen.classList.add("hidden");

  homeScreen.classList.remove("hidden");


  loadProjects();

  startHeartbeat();

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  if(heartbeatTimer){

    clearInterval(
      heartbeatTimer
    );

  }


  heartbeatTimer = null;

  currentUserId = null;


  localStorage.removeItem(
    USER_ID_KEY
  );


  homeScreen.classList.add(
    "hidden"
  );


  authScreen.classList.remove(
    "hidden"
  );


  setAuthTab("login");


  toastMsg(
    "Logout हो गया।"
  );

}


/* =========================================================
   EVENTS
========================================================= */

$("yesCollege")
  .addEventListener(
    "click",
    () => {

      if(currentUserId){

        goHome();

      }else{

        showAuth("register");

      }

    }
  );


$("noCollege")
  .addEventListener(
    "click",
    () => {

      collegeScreen.classList.remove(
        "hidden"
      );

      authScreen.classList.add(
        "hidden"
      );

      homeScreen.classList.add(
        "hidden"
      );

    }
  );


registerTab.addEventListener(
  "click",
  () => setAuthTab("register")
);


loginTab.addEventListener(
  "click",
  () => setAuthTab("login")
);


registerForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    registerUser();

  }
);


loginForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    loginUser();

  }
);


$("logoutBtn")
  .addEventListener(
    "click",
    logout
  );


/* =========================================================
   AUTO LOGIN
========================================================= */

if(currentUserId){

  goHome();

}

</script>
